# Прокси раннера ревью Copilot. Хост пропускается, только если совпал со строкой `allowlist`
Port 8888
Listen 0.0.0.0

# Раннер ждёт задание долгим опросом брокера: короче минуты соединение рвалось бы впустую
Timeout 600

# Запросы принимаются только из сетей Docker
Allow 127.0.0.1
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Раннер ходит только по HTTPS
ConnectPort 443

Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

# Непропущенный хост пишется в журнал контейнера: по нему список и пополняется
LogLevel Connect
MaxClients 50
