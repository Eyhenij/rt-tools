name: Publish @rt-tools/store to npm

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Specify version: patch, minor, major, or specific version (e.g. 1.2.3)'
                required: true
                default: 'patch'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.22.3]

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
                  token: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.10.0
                  run_install: false

            - name: Cache node_modules
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  registry-url: https://registry.npmjs.org/

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile
                  sudo apt-get install jq

            - name: Update version
              run: |
                  node update-version-store.cjs ${{ github.event.inputs.version }}
                  pnpm run changelog:store
                  VERSION=$(jq -r .version projects/store/package.json)
                  echo "VERSION=$VERSION" >> $GITHUB_ENV

            - uses: EndBug/add-and-commit@v11
              with:
                  default_author: github_actions
                  message: 'chore(rt:store): версия пакета поднята до ${{ env.VERSION }} [ci skip]'

            - name: Create git tag
              run: |
                  git tag "rt-store@${{ env.VERSION }}"
                  git push origin "rt-store@${{ env.VERSION }}"

            - name: Build store
              run: pnpm run build:store

            # Импорт из соседа, которого нет в опубликованной версии соседа, ломает сборку у
            # потребителя, а в дереве зелёный: типы читают исходники. Судится строго — выпуск с
            # таким импортом не выходит; сначала публикуется сосед.
            - name: Imports against published neighbours
              run: node tools/check-package-imports.mjs --strict --package @rt-tools/store

            - name: Publish
              run: pnpm run packagr:store
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # Замок пересобирается после публикации, а не вместе с версией: подъём вписал
            # зависимым пакетам версию, которой в реестре ещё нет, и до публикации pnpm её не
            # разрешает — так упал первый же выпуск ядра после переноса пересборки в шаг версии.
            # Реестр отдаёт свежую версию с задержкой в секунды, поэтому попыток несколько.
            - name: Rebuild lockfile
              run: |
                  for attempt in 1 2 3 4 5 6; do
                      pnpm install --lockfile-only && break
                      [ "$attempt" = 6 ] && exit 1
                      sleep 20
                  done

            - uses: EndBug/add-and-commit@v11
              with:
                  default_author: github_actions
                  message: 'chore(rt:store): замок зависимостей пересобран под ${{ env.VERSION }} [ci skip]'
