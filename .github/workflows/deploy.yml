name: Deploy

# Выкатка начинается рукой человека, а не слиянием: слияние в главную ветку идёт по несколько
# раз в день, и каждое из них перезапускало бы приёмник посреди приёма груза. Правки самого
# конвейера при этом проверяются тем же запуском с ветки — он доходит до сборок и там встаёт,
# потому что выкатку держит условие по главной ветке у своего задания.
#
# Сам переключатель начинает работать после того, как окажется в главной ветке: эту правку им
# проверить нельзя, следующую — можно.
on:
    workflow_dispatch:

# Выкатки идут по очереди и друг друга не отменяют: половина выкатки, отменённая следующей,
# оставляет узел с накатанной миграцией и старым образом.
concurrency:
    group: prod-deploy
    cancel-in-progress: false

jobs:
    # Сборки идут на раннере машины: у него уже прогрето хранилище пакетов, а канал в облако
    # узкий. Образов два — приёмник и дорога со статикой админки внутри.
    build-images:
        name: Build ${{ matrix.image }} image
        runs-on: [self-hosted, macOS, ARM64]
        permissions:
            contents: read
            packages: write
        strategy:
            # По одному: канал у машины один на всех, и две установки зависимостей разом забивают
            # его друг другу. Первый образ заодно наполняет хранилище пакетов в кэше сборщика, и
            # второму качать почти нечего.
            max-parallel: 1
            matrix:
                include:
                    - image: api
                      dockerfile: deploy/message-bus.Dockerfile
                    - image: web
                      dockerfile: deploy/message-bus-web.Dockerfile
        steps:
            - uses: actions/checkout@v7

            # Пароль реестра кладётся в файл настроек напрямую, а не через `docker login`. Клиент
            # на macOS подставляет помощника связки ключей сам, даже когда каталог настроек свой и
            # пустой: `{"credsStore":""}` он молча переписывает обратно и уносит пароль туда — а из
            # службы помощник отказывает во взаимодействии, и задание падает до сборки. С паролем
            # в файле помощник не зовётся ни разу.
            #
            # Свой каталог уносит с собой и текущий контекст: без него клиент идёт в
            # `/var/run/docker.sock`, которого на машине с Docker Desktop нет вовсе, и любая
            # команда отвечает «is the daemon running». Адрес демона поэтому задаётся явно.
            #
            # Объявления сборщиков лежат там же, и с временным каталогом buildx их не находит.
            # Все три объявляются здесь, а не в `env` задания: там контекст `runner` недоступен, и
            # файл с ним хостинг не принимает вовсе — прогон кончается за ноль секунд, не начав ни
            # одного задания. Внутри шага то же значение приходит переменной `RUNNER_TEMP`.
            - name: Authenticate to registry and point Docker at the daemon
              env:
                  REGISTRY_USER: ${{ github.actor }}
                  REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  config="${RUNNER_TEMP}/docker"
                  mkdir -p "${config}"
                  auth=$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_TOKEN}" | base64)
                  printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "${auth}" > "${config}/config.json"
                  chmod 600 "${config}/config.json"
                  echo "DOCKER_CONFIG=${config}" >> "${GITHUB_ENV}"
                  echo "DOCKER_HOST=unix://${HOME}/.docker/run/docker.sock" >> "${GITHUB_ENV}"
                  echo "BUILDX_CONFIG=${HOME}/.docker/buildx" >> "${GITHUB_ENV}"

            # Сборщик заведён под именем и переживает задание: в его кэше живут и слои, и
            # хранилище пакетов из `--mount=type=cache`. Снесённый в конце сборщик уносил бы их с
            # собой, и каждая выкатка тянула бы всё дерево зависимостей заново.
            - uses: docker/setup-buildx-action@v4
              with:
                  name: message-bus-builder
                  cleanup: false
                  cache-binary: false

            # Платформа объявлена явно, а не берётся у сборщика: машина сборки на ARM, узел на
            # x86_64, и образ, собранный умолчанием, молча не стартует.
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64
                  push: true
                  # Обе метки: по sha выкатывается узел, «последний» остаётся человеку, который
                  # тянет образ руками. Узел за подвижной меткой не ходит никогда.
                  tags: |
                      ghcr.io/eyhenij/message-bus-${{ matrix.image }}:${{ github.sha }}
                      ghcr.io/eyhenij/message-bus-${{ matrix.image }}:latest

            # Раннер машины живёт между прогонами, и пароль реестра остался бы лежать на диске
            # владельца до следующего задания. Каталог назван от `RUNNER_TEMP`, а не от
            # `DOCKER_CONFIG`: шаг идёт даже после отказа предыдущего, а тот мог не дойти до
            # объявления переменной.
            - name: Drop registry credentials
              if: always()
              run: rm -rf "${RUNNER_TEMP}/docker"

    # Выкатка облачная: она не должна зависеть от того, включена ли машина владельца. Ей нужен
    # только доступ к узлу по ключу.
    deploy:
        name: Deploy to node
        needs: [build-images]
        # Запуск с ветки доходит до сборок и на этом кончается: выкатка идёт из главной ветки и
        # ниоткуда больше. Иначе прогон ради проверки конвейера увёз бы на узел недоделанную ветку.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v7

            - name: Set up SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

            # На узел уезжает только то, из чего он поднимается: состав прода, конфиг дороги и
            # сценарий чистки. Кода там нет вовсе — он внутри образов.
            #
            # Окружение прода `.env.prod` живёт только на узле и защищено от удаления: пароль базы
            # правится реже, чем выкатка, и каждая её правка иначе трогала бы секреты. Той же
            # защитой стоят каталог дампов и журнал выгрузки: `--delete` сносит на узле всё, чего
            # нет в дереве, и без неё каждая выкатка уносила бы все точки возврата разом.
            - name: Sync deploy files
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
              run: |
                  rsync -az --delete \
                      --filter 'P .env.prod' \
                      --filter 'P dumps/' \
                      --filter 'P dump.log' \
                      -e "ssh -i ~/.ssh/deploy_key" \
                      docker-compose.prod.yml deploy/ \
                      "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/message-bus/"

            # Расписание выгрузки дампа едет на узел вместе с составом и ставится здесь, а не
            # рукой: поставленное рукой снимается первым же переносом узла и не проверяется ничем.
            # Своя строка узнаётся по имени сценария: чужие строки расписания остаются, своя
            # стоит один раз, сколько бы выкаток ни прошло.
            - name: Install dump schedule
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
              run: |
                  ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
                      "{ crontab -l 2>/dev/null | grep -v 'dump.sh save'; grep -v '^#' /opt/message-bus/dump.crontab; } | crontab - \
                      && crontab -l | grep 'dump.sh save'"

            # Узел логинится в реестр разовым токеном прогона, тянет образы того самого коммита и
            # поднимает состав. `--no-build` здесь не украшение: без него compose попытался бы
            # собрать образ на узле, которому 961 МБ памяти.
            - name: Pull images and restart stack
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REGISTRY_USER: ${{ github.actor }}
              run: |
                  ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
                      "cd /opt/message-bus \
                      && echo '${REGISTRY_TOKEN}' | docker login ghcr.io -u '${REGISTRY_USER}' --password-stdin \
                      && IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.prod.yml --env-file .env.prod pull migrate api web \
                      && IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build --remove-orphans \
                      && docker logout ghcr.io"

            # Поднятый контейнер и отвечающая служба — разные утверждения: между ними лежит и
            # накат миграций, и связь с базой. Проба идёт снаружи, по имени: так же, как до
            # приёмника доходит дерево.
            - name: Health check
              env:
                  DEPLOY_ORIGIN: ${{ secrets.DEPLOY_ORIGIN }}
              run: |
                  for attempt in $(seq 1 12); do
                      if curl -fsS -m 15 "${DEPLOY_ORIGIN}/api/health" | grep -q '"status":"ok"'; then
                          echo 'приёмник отвечает'
                          exit 0
                      fi
                      echo "попытка ${attempt}: приёмник ещё не отвечает, повтор через 5 с"
                      sleep 5
                  done
                  echo 'приёмник не ответил за отведённое время'
                  exit 1

            # После пробы, а не вместе с перезапуском: прежний sha — это то, на что откатываются,
            # когда новый не поднялся. Шаг не обязан удаться, чтобы выкатка считалась
            # состоявшейся: место — не то, ради чего роняют зелёный прогон.
            - name: Prune old images
              continue-on-error: true
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
              run: |
                  ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
                      'bash /opt/message-bus/prune-images.sh'
