name: CI

# Заявка проверяется, куда бы она ни вливалась. Фильтр по главной ветке оставлял без прогона
# всю череду: заявка череды открывается с основанием на предыдущей ветке — так велит правило
# поставки, — и события конвейер не получал вовсе. Вернуть его было нечем: ни новый коммит, ни
# перезакрытие заявки базы не меняют. Цена — прогоны идут чаще; она дешевле влитой непроверенной
# работы, потому что череда вливается снизу вверх и нижняя ветка увозит в главную всё, что на
# ней стоит.
on:
    pull_request:

# Раннер один и стоит на машине владельца. Он же и разводит прогоны по времени: самодельный
# раннер берёт одну работу за раз. Общая на всё дерево группа этого не добавляла, а стоила
# прогонов: у хостинга в группе ждёт ровно один прогон, и третий пришедший отменяет того, кто
# ждал. Так за один час погибли прогоны трёх заявок — страница заявки при этом выглядит как у
# той, чей прогон ещё не начинался, и владелец жмёт слияние на непроверенной работе.
#
# Поэтому группа своя у каждой ветки: заявки больше не отбирают друг у друга единственное место
# ожидания. Столкновение за порт стенда, диск, кэш сборщика и демон образов держит не эта
# настройка, а тот же единственный раннер — конвейер и выкладка в главную ходят на него с разными
# группами, и ничем другим они не разведены. Появится второй раннер — понадобится замок на самой
# машине: очередь у хостинга делает это ценой отменённых прогонов.
#
# Идущий прогон новым пушем не отменяется. Отменённый в списке выглядит красным ровно так же, как
# упавший, — а неразличимость красного и есть то, ради чего очередь заводится.
concurrency:
    group: ci-self-hosted-${{ github.ref }}
    cancel-in-progress: false

jobs:
    main:
        runs-on: [self-hosted, macOS, ARM64]

        strategy:
            matrix:
                node-version: [22.22.3]

        # Имена стенда сквозной спеки. Умолчание — 3310, 4310 и `message_bus_e2e` — оставлено
        # локальному прогону и гейту пуша: они идут на той же машине, и совпади имена, стенды
        # легли бы друг на друга даже при очереди из прогонов.
        # Локаль задания. Служба раннера идёт без неё, а образцы гардов написаны кириллицей:
        # складывание регистра у такого слова работает только под UTF-8, и в пустой локали гард
        # молча пропускает то, что обязан вернуть. Три сценария так и падали здесь, проходя на
        # машине, где их писали.
        env:
            LANG: en_US.UTF-8
            LC_ALL: en_US.UTF-8
            E2E_API_PORT: 3320
            E2E_ADMIN_PORT: 4320
            E2E_DATABASE: message_bus_e2e_ci

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.10.0
                  run_install: false

            - name: Cache node_modules
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch main branch
              run: git fetch origin main

            # Состав правки решает состав набора: ветка, не тронувшая ни строки кода, не
            # поднимает стенда, не снимает кадров и не собирает образов. Признак считается
            # один раз и объявляется выводом шага — переспрошенный в каждом условии, он
            # разъезжается сам с собой при первой же правке одного из них.
            #
            # Текстовой считается ветка, у которой каждый задетый файл — либо `.md`, либо
            # лежит под `docs/`. Всё остальное, включая обвязку и настройки, считается кодом:
            # признак должен ошибаться в сторону лишнего прогона, а не пропущенного.
            - name: Состав правки
              id: scope
              run: |
                  changed=$(git diff --name-only origin/main...HEAD)
                  code=$(printf '%s\n' "$changed" | grep -vE '(^docs/|\.md$)' || true)
                  if [ -n "$changed" ] && [ -z "$code" ]; then
                      echo 'docs_only=true' >> "$GITHUB_OUTPUT"
                      echo 'Правка только текстовая: стенд, снимки витрин и образы пропускаются.'
                      printf '%s\n' "$changed"
                  else
                      echo 'docs_only=false' >> "$GITHUB_OUTPUT"
                  fi

            # Клиент докера без помощника хранения ключей.
            #
            # Раннер запущен службой, у неё нет сеанса пользователя, а в настройках владельца
            # стоит `credsStore: desktop`. Клиент идёт в него на любой команде — даже за
            # публичным образом, которому вход не нужен вовсе, — и получает отказ: «keychain
            # cannot be accessed because the current session does not allow user interaction».
            # Задание падает на первой же строке шага стенда, и выглядит это поломкой стенда.
            #
            # Свой каталог настроек пуст: ни помощника, ни записей входа. Всё, что тянет
            # конвейер, лежит в открытых реестрах, и вход ему не нужен; понадобится — пароль
            # пишется в этот же файл прямо, а не командой входа.
            #
            # `DOCKER_HOST` не для красоты: свой каталог уносит с собой и текущий контекст, а без
            # него клиент идёт в общесистемный сокет, которого на машине с настольным клиентом
            # нет вовсе, и отвечает «нет такого файла» на что угодно.
            - name: Докер без помощника ключей
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  dir="$RUNNER_TEMP/docker-config"
                  mkdir -p "$dir"
                  printf '{}' > "$dir/config.json"
                  echo "DOCKER_CONFIG=$dir" >> "$GITHUB_ENV"
                  echo "DOCKER_HOST=unix://$HOME/.docker/run/docker.sock" >> "$GITHUB_ENV"
                  DOCKER_CONFIG="$dir" DOCKER_HOST="unix://$HOME/.docker/run/docker.sock" \
                      docker info --format 'демон: {{.ServerVersion}}'

            # Сценарии гардов дерева. Гард — единственная часть слоя правил, которую исполняет
            # машина: ошибка в нём молчит, потому что сломанный гард пропускает ход, а пропуск
            # неотличим от «всё в порядке». Сети шаг не трогает — помощник хостинга подставлен.
            - name: Hook scenarios
              run: node tools/check-hooks.mjs

            # Граница пакета правил: он ставится в чужие деревья, и ресурс, у которого там нет
            # ни предмета, ни исполнителя, читается наравне с остальными — та же шапка, тот же
            # закон сверху. Исполнитель берёт его в работу и упирается в пустой компаньон.
            - name: Package boundary
              run: node tools/check-boundary.mjs

            # Импорт из соседнего пакета символа, которого в опубликованной версии соседа нет.
            # В дереве такой импорт зелёный — типы читают исходники соседа, — а у потребителя
            # пакет не собирается. Символ, который ждёт публикации соседа, здесь не роняет:
            # между двумя выпусками это обычное состояние; роняет его строгий шаг конвейера
            # публикации.
            - name: Imports against published neighbours
              run: node tools/check-package-imports.mjs

            # Разложенный файл, видимый форматтеру. Тело каждого закрыто суммой в его шапке, и
            # форматтер, приведя файл к своему виду, делает раскладку отставшей: дальше она
            # отказывает по нему целиком и не кладёт ни одного другого. Гард места правки сюда
            # не достаёт — он судит вызов исполнителя, а форматтер работает крючком системы
            # контроля версий, то есть правит файл уже в индексе.
            - name: Laid-out files hidden from the formatter
              run: node tools/check-format-ignore.mjs

            # Круги импортов внутри пакета: сборка их переживает, отдавая одному из участников
            # недособранный модуль, а линтер о них не знает вовсе. Всплывает это у потребителя
            # — символом, который на старте оказался пустым, — и стоит отладки в чужом дереве.
            # Длина описаний правил: описание едет в системный промпт каждого захода целиком,
            # и растёт оно само — его пишут вслед за правилом и пересказывают в нём содержимое.
            # Ни одна другая проверка длину шапки не считает, а заход платит её всегда.
            - name: Rule descriptions
              run: node tools/check-descriptions.mjs

            - name: Circular imports
              run: node tools/check-cycles.mjs

            # Срок хранения описания прошлого. Каталог набирает по записи на каждую закрытую
            # работу и не отдаёт обратно ничего: одной чистки хватает ровно на неделю, дальше
            # первая запись перестаивает снова. Без этого шага срок держался бы памятью того,
            # кто помнит про команду чистки.
            - name: Archive retention
              run: node tools/check-archive-age.mjs

            # Надстройки профиля против таблиц компаньонов. Правило говорит одно, дерево работает
            # по-другому, и оба места законны — но читатель ищет расхождение в компаньоне, а
            # объявлено оно переменной профиля. Не названное там замещение оставляет читателю
            # пакетное умолчание: правило требовало одной формы заголовка заявки, дерево замещало
            # её, и гард, читавший форму, номера не доставал вовсе.
            - name: Profile drift
              run: node tools/check-profile-drift.mjs

            # Цепочка переездов хранилища на чистой базе. Порядок применения задан временем
            # создания, и переезд из ветки, начатой раньше, встаёт до того, от которого зависит:
            # на развёрнутой базе разработчика это не видно вовсе, а на чистой — падает, то есть
            # впервые на выкатке. В гейте пуша проверка стоит с самого её появления, а здесь её
            # не было: у машины, которая толкает ветку, база может быть погашена — тогда гейт
            # законно пропускает, и цепочку не проверяет никто.
            - name: Migrations against a clean database
              if: steps.scope.outputs.docs_only != 'true'
              # Порт и имя контейнера свои, не рабочие: раннер стоит на машине разработчика, и
              # порт 55432 занят его собственной базой — шаг забрал бы её у него или не поднялся
              # бы вовсе.
              env:
                  DATABASE_URL: postgresql://message_bus:message_bus@localhost:55452/message_bus
              run: |
                  docker rm -f rt-ci-schema >/dev/null 2>&1 || true
                  docker run -d --rm --name rt-ci-schema \
                      -e POSTGRES_USER=message_bus -e POSTGRES_PASSWORD=message_bus \
                      -e POSTGRES_DB=message_bus -p 55452:5432 postgres:16-alpine >/dev/null
                  until docker exec rt-ci-schema pg_isready -U message_bus >/dev/null 2>&1; do sleep 1; done
                  node tools/check-schema-drift.mjs
                  docker rm -f rt-ci-schema >/dev/null 2>&1 || true

            # Объявление гарда против того, на что ветвится его тело. Ветка, которой нет в
            # объявлении, не исполняется ни разу — под этим именем гард не зовут, — а снаружи он
            # выглядит работающим: путь назван, файл разложен, набор сценариев зелёный.
            - name: Hook scope
              run: node tools/check-hook-scope.mjs

            # Слой оформления второго кита: собранные токены против источника, граф ссылок между
            # ними, полнота тем и объявления в стилях, порядок каскадных слоёв. Ни одну из пяти не
            # звал ни гейт пуша, ни конвейер — и `check-tokens-graph` стоял красным несколько дней
            # подряд, а ни один пуш об этом не сказал. Вместе они идут три секунды, поэтому
            # одним шагом и без признака состава правки.
            - name: Style layer
              run: |
                  node tools/build-tokens-v2.mjs --check
                  node tools/check-tokens-graph.mjs
                  node tools/check-tokens-theme.mjs
                  node tools/check-preset-complete.mjs
                  node tools/check-gradient-stops.mjs
                  node tools/check-tokens-styles.mjs
                  node tools/check-cascade-layer.mjs

            # Перечень соответствия значков первого кита значкам второго. Своим шагом, а не в
            # слое оформления: тот про цвет и каскад, а этот про набор рисунков. Промах здесь
            # ничем другим не ловится — имя без файла гасит только свой значок, и на экране это
            # пустое место при зелёном прогоне.
            - name: Icon map
              run: node tools/check-icon-map.mjs

            # Витрина показывает оба набора оформления рядом. Расхождение двух наборов — единственное,
            # чего не увидеть, глядя на один из них: одна половина читается как «так и было». Проверка
            # держит не сборку набора, а то, что человеку есть на что посмотреть.
            - name: Preset stories
              run: node tools/check-preset-stories.mjs
            - name: Showcase links
              run: node tools/check-showcase-links.mjs

            # `typecheck` проверяет типы там, где их не проверяет ничто другое:
            # Jest транспилирует спеки без проверки типов, а ESLint здесь не
            # type-aware, так что спека могла годами гонять форму, которой по
            # типам компонента не бывает. Цель объявлена не у всех проектов —
            # у кого её нет, тот пропускается.
            - name: Test, Lint, Typecheck, Build
              run: |
                  pnpm exec nx affected -t lint typecheck test build --parallel --base=origin/main --head=HEAD

            # Сценарии по гардам, проверкам и умолчаниям пакета правил. Отдельным шагом, потому
            # что это исполняемые файлы, а не код на TypeScript: линтер их не читает, спеки не
            # исполняют, а сломанная строка в любом из них уезжает в чужое дерево зелёным
            # прогоном. До этого шага их не гонял никто, кроме руки, — и «снятие тела гарда
            # роняет прогон» было неправдой: прогона не было.
            - name: Hook suites
              run: |
                  pnpm exec nx affected -t test-hooks --base=origin/main --head=HEAD

            # Линтер кода файлы стилей не читает вовсе, поэтому оформление проверяется
            # отдельным прогоном. Порог замечаний объявлен при самом скрипте: правило,
            # включённое замечанием, обязано ронять прогон наравне с отказом.
            - name: Stylelint
              if: steps.scope.outputs.docs_only != 'true'
              run: pnpm run lint:styles

            # Сквозной набор админки: единственная проверка дерева, идущая тем же путём, что и
            # человек. Стенд он поднимает себе сам — прод-сборки приёмника и админки, своя база
            # и засев, — и гасит его вместе с прогоном; хранилищу нужен только поднятый контейнер
            # базы. Шаг стоит до витрин намеренно: они оставляют свои серверы работать, и стенд
            # соревновался бы с ними за машину.
            - name: E2E admin
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  docker compose up -d db

                  # База стенда спрашивается до самого набора и своим отказом. Кончившееся в
                  # томе Docker место валит не тот шаг, который его съел, а тот, которому оно
                  # понадобилось следующим: контейнер базы уходит в вечный перезапуск с
                  # `No space left on device`, а красным становится набор — полтора десятка
                  # спек про экраны у ветки, не тронувшей ни строки кода приёмника. По этому
                  # лицу дважды подряд перезапускали прогон и искали причину в правке.
                  # Имя контейнера спрашивается у состава, а не пишется строкой: оно
                  # собирается из имени каталога, а на раннере оно своё.
                  db=$(docker compose ps -q db)
                  for _ in $(seq 1 30); do
                      [ "$(docker inspect --format '{{.State.Health.Status}}' "$db" 2>/dev/null || echo none)" = healthy ] && break
                      sleep 2
                  done
                  if [ "$(docker inspect --format '{{.State.Health.Status}}' "$db" 2>/dev/null || echo none)" != healthy ]; then
                      echo '::error::База стенда не поднялась. Ниже — её лог и занятое место: набор дальше не идёт, и красное в нём было бы не про правку.'
                      docker logs --tail 20 "$db" 2>&1 || true
                      docker system df
                      exit 1
                  fi

                  node node_modules/.pnpm/playwright@*/node_modules/playwright/cli.js install chromium
                  pnpm exec nx run message-bus-admin-e2e:e2e

            # Снимки витрины: замер вычисленных значений отвечает только на заданный вопрос,
            # а снимок ловит всё видимое разом. Эталоны сняты на этой же машине — раннер
            # собственный, и разницы платформ, из-за которой обычно поднимают контейнер, нет.
            #
            # Порт свой: раннер делит машину с разработчиком, и прогон, прибитый к 6006,
            # подцепил бы витрину, поднятую руками, вместо своей.
            - name: Visual tests
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  node node_modules/.pnpm/playwright@*/node_modules/playwright/cli.js install chromium
                  pnpm exec nx run @rt-tools/ui-kit:storybook --port 6106 --no-open > /tmp/storybook-ci.log 2>&1 &
                  for _ in $(seq 1 120); do
                      curl -sf http://localhost:6106/index.json > /dev/null && break
                      sleep 2
                  done
                  STORYBOOK_URL=http://localhost:6106 pnpm run test:visual

            - name: Upload visual diffs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: visual-diffs
                  path: projects/ui-kit/.storybook/__snapshots__/__diff_output__/
                  if-no-files-found: ignore

            # Снимки второй витрины — свой шаг, а не строка в соседнем: киты разведены намеренно,
            # у каждого своя настройка прогона, свой каталог эталонов и свой порт. Общий шаг связал
            # бы их там, где связи нет, а вложение с картинками различий перестало бы говорить,
            # чьи кадры разошлись.
            #
            # Порт 6107 — свой, по той же причине, что и 6106 у первой витрины: раннер делит
            # машину с разработчиком.
            #
            # Витрина поднимается без `RT_SNAPSHOT_RUN`: этим признаком прогон снимает аддон
            # псевдосостояний, и витрина, поднятая с ним, теряет наведение, фокус и нажатие.
            # Ставит его сама команда прогона, и только себе.
            - name: Visual tests (ui-kit-v2)
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  pnpm exec nx run @rt-tools/ui-kit-v2:storybook --port 6107 --no-open > /tmp/storybook-v2-ci.log 2>&1 &
                  for _ in $(seq 1 120); do
                      curl -sf http://localhost:6107/index.json > /dev/null && break
                      sleep 2
                  done
                  STORYBOOK_URL=http://localhost:6107 pnpm run test:visual:v2

            - name: Upload visual diffs (ui-kit-v2)
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: visual-diffs-ui-kit-v2
                  path: projects/ui-kit-v2/.storybook/__snapshots__/__diff_output__/
                  if-no-files-found: ignore

            # Only @rt-tools/utils defines `verify`; it asserts the built package stays consumable
            # outside Angular. Projects without the target are skipped.
            - name: Verify built packages
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  pnpm exec nx affected -t verify --parallel --base=origin/main --head=HEAD

            # Образ приёмника: сборка, а не подъём. Собирается он не тем же способом, что
            # приложение, — своим файлом и своим набором копируемых каталогов, — и недостающий
            # каталог виден только здесь: линтеры, юниты и `nx build` берут дерево целиком и о
            # содержимом образа не знают ничего. Образ простоял несобирающимся до этого шага, и
            # отказов в нём было два сразу: не копировался пакет правил и не копировалась схема
            # хранилища, без которой отказывает сама установка зависимостей.
            - name: Build API image
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  docker build -f deploy/message-bus.Dockerfile -t message-bus:ci .

            # Образ дороги: проксировщик со статикой админки внутри. Собирается он своим набором
            # копируемых каталогов и своей целью сборки, и недостающий каталог виден только
            # здесь — так же, как у образа приёмника. Выкатка тянет оба, и несобравшийся второй
            # означал бы узел с новым приёмником за старой админкой.
            - name: Build web image
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  docker build -f deploy/message-bus-web.Dockerfile -t message-bus-web:ci .

            # Уборка за прогоном. Раннер живёт между прогонами на машине владельца, и всё, что
            # прогон оставляет, копится там до тех пор, пока место не кончится: сквозной набор
            # упал на `could not extend file: No space left on device`, когда томов набралось
            # 213 на 28 ГБ, а кэша сборки — почти 10 ГБ. Со стороны это выглядело поломкой
            # хранилища, и по этому лицу чинили бы репозиторий.
            #
            # Убирается только своё, и отбор поимённый. Общая чистка запрещена: раннер делит
            # машину с разработчиком и с другими проектами, и `docker system prune`,
            # `docker volume prune` и снятие по маске унесли бы чужое молча.
            #
            # Идёт шагом `always()`: место кончается как раз тогда, когда прогон падает, и
            # уборка, пропущенная на падении, не случается ровно в тот раз, когда она нужна.
            - name: Убрать за прогоном
              if: always() && steps.scope.outputs.docs_only != 'true'
              run: |
                  # Свои образы прогона: сняты по имени, а не по маске и не по возрасту.
                  docker image rm -f message-bus:ci message-bus-web:ci 2>/dev/null || true

                  # Анонимные тома без метки проекта — следы одноразовых контейнеров. Том с
                  # меткой принадлежит чьему-то составу, в том числе чужому, и не трогается.
                  for v in $(docker volume ls -q -f dangling=true); do
                      label=$(docker volume inspect "$v" --format '{{index .Labels "com.docker.compose.project"}}' 2>/dev/null || true)
                      [ -z "$label" ] && docker volume rm "$v" >/dev/null 2>&1 || true
                  done

                  # Кэш сборщика старше суток: свежий нужен следующему прогону, вчерашний уже
                  # ничей. Порог, а не полная чистка, — иначе каждая сборка идёт с нуля.
                  docker builder prune --force --filter until=24h >/dev/null 2>&1 || true

                  # Возраст один места не гарантирует: кончается оно от того, что накопилось
                  # сегодня, а порог по возрасту такого кэша не видит. За заход, набравший
                  # двадцать один гигабайт свежего кэша, уборка по суткам освободила девяносто
                  # пять мегабайт, и следующий прогон встал на нехватке места. Поэтому у кэша
                  # есть ещё и предел размера — он держит его в берегах независимо от возраста.
                  docker builder prune --force --max-used-space 10GB >/dev/null 2>&1 || true

                  docker system df
