name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    main:
        runs-on: [self-hosted, macOS, ARM64]

        strategy:
            matrix:
                node-version: [22.22.3]

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.10.0
                  run_install: false

            - name: Cache node_modules
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch main branch
              run: git fetch origin main

            # Состав правки решает состав набора: ветка, не тронувшая ни строки кода, не
            # поднимает стенда, не снимает кадров и не собирает образов. Признак считается
            # один раз и объявляется выводом шага — переспрошенный в каждом условии, он
            # разъезжается сам с собой при первой же правке одного из них.
            #
            # Текстовой считается ветка, у которой каждый задетый файл — либо `.md`, либо
            # лежит под `docs/`. Всё остальное, включая обвязку и настройки, считается кодом:
            # признак должен ошибаться в сторону лишнего прогона, а не пропущенного.
            - name: Состав правки
              id: scope
              run: |
                  changed=$(git diff --name-only origin/main...HEAD)
                  code=$(printf '%s\n' "$changed" | grep -vE '(^docs/|\.md$)' || true)
                  if [ -n "$changed" ] && [ -z "$code" ]; then
                      echo 'docs_only=true' >> "$GITHUB_OUTPUT"
                      echo 'Правка только текстовая: стенд, снимки витрин и образы пропускаются.'
                      printf '%s\n' "$changed"
                  else
                      echo 'docs_only=false' >> "$GITHUB_OUTPUT"
                  fi

            # Сценарии гардов дерева. Гард — единственная часть слоя правил, которую исполняет
            # машина: ошибка в нём молчит, потому что сломанный гард пропускает ход, а пропуск
            # неотличим от «всё в порядке». Сети шаг не трогает — помощник хостинга подставлен.
            - name: Hook scenarios
              run: node tools/check-hooks.mjs

            # `typecheck` проверяет типы там, где их не проверяет ничто другое:
            # Jest транспилирует спеки без проверки типов, а ESLint здесь не
            # type-aware, так что спека могла годами гонять форму, которой по
            # типам компонента не бывает. Цель объявлена не у всех проектов —
            # у кого её нет, тот пропускается.
            - name: Test, Lint, Typecheck, Build
              run: |
                  pnpm exec nx affected -t lint typecheck test build --parallel --base=origin/main --head=HEAD

            # Линтер кода файлы стилей не читает вовсе, поэтому оформление проверяется
            # отдельным прогоном. Порог замечаний объявлен при самом скрипте: правило,
            # включённое замечанием, обязано ронять прогон наравне с отказом.
            - name: Stylelint
              if: steps.scope.outputs.docs_only != 'true'
              run: pnpm run lint:styles

            # Сквозной набор админки: единственная проверка дерева, идущая тем же путём, что и
            # человек. Стенд он поднимает себе сам — прод-сборки приёмника и админки, своя база
            # и засев, — и гасит его вместе с прогоном; хранилищу нужен только поднятый контейнер
            # базы. Шаг стоит до витрин намеренно: они оставляют свои серверы работать, и стенд
            # соревновался бы с ними за машину.
            - name: E2E admin
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  docker compose up -d db
                  node node_modules/.pnpm/playwright@*/node_modules/playwright/cli.js install chromium
                  pnpm exec nx run message-bus-admin-e2e:e2e

            # Снимки витрины: замер вычисленных значений отвечает только на заданный вопрос,
            # а снимок ловит всё видимое разом. Эталоны сняты на этой же машине — раннер
            # собственный, и разницы платформ, из-за которой обычно поднимают контейнер, нет.
            #
            # Порт свой: раннер делит машину с разработчиком, и прогон, прибитый к 6006,
            # подцепил бы витрину, поднятую руками, вместо своей.
            - name: Visual tests
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  node node_modules/.pnpm/playwright@*/node_modules/playwright/cli.js install chromium
                  pnpm exec nx run @rt-tools/ui-kit:storybook --port 6106 --no-open > /tmp/storybook-ci.log 2>&1 &
                  for _ in $(seq 1 120); do
                      curl -sf http://localhost:6106/index.json > /dev/null && break
                      sleep 2
                  done
                  STORYBOOK_URL=http://localhost:6106 pnpm run test:visual

            - name: Upload visual diffs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diffs
                  path: projects/ui-kit/.storybook/__snapshots__/__diff_output__/
                  if-no-files-found: ignore

            # Снимки второй витрины — свой шаг, а не строка в соседнем: киты разведены намеренно,
            # у каждого своя настройка прогона, свой каталог эталонов и свой порт. Общий шаг связал
            # бы их там, где связи нет, а вложение с картинками различий перестало бы говорить,
            # чьи кадры разошлись.
            #
            # Порт 6107 — свой, по той же причине, что и 6106 у первой витрины: раннер делит
            # машину с разработчиком.
            #
            # Витрина поднимается без `RT_SNAPSHOT_RUN`: этим признаком прогон снимает аддон
            # псевдосостояний, и витрина, поднятая с ним, теряет наведение, фокус и нажатие.
            # Ставит его сама команда прогона, и только себе.
            - name: Visual tests (ui-kit-v2)
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  pnpm exec nx run @rt-tools/ui-kit-v2:storybook --port 6107 --no-open > /tmp/storybook-v2-ci.log 2>&1 &
                  for _ in $(seq 1 120); do
                      curl -sf http://localhost:6107/index.json > /dev/null && break
                      sleep 2
                  done
                  STORYBOOK_URL=http://localhost:6107 pnpm run test:visual:v2

            - name: Upload visual diffs (ui-kit-v2)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diffs-ui-kit-v2
                  path: projects/ui-kit-v2/.storybook/__snapshots__/__diff_output__/
                  if-no-files-found: ignore

            # Only @rt-tools/utils defines `verify`; it asserts the built package stays consumable
            # outside Angular. Projects without the target are skipped.
            - name: Verify built packages
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  pnpm exec nx affected -t verify --parallel --base=origin/main --head=HEAD

            # Образ приёмника: сборка, а не подъём. Собирается он не тем же способом, что
            # приложение, — своим файлом и своим набором копируемых каталогов, — и недостающий
            # каталог виден только здесь: линтеры, юниты и `nx build` берут дерево целиком и о
            # содержимом образа не знают ничего. Образ простоял несобирающимся до этого шага, и
            # отказов в нём было два сразу: не копировался пакет правил и не копировалась схема
            # хранилища, без которой отказывает сама установка зависимостей.
            - name: Build API image
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  docker build -f deploy/message-bus.Dockerfile -t message-bus:ci .

            # Образ дороги: проксировщик со статикой админки внутри. Собирается он своим набором
            # копируемых каталогов и своей целью сборки, и недостающий каталог виден только
            # здесь — так же, как у образа приёмника. Выкатка тянет оба, и несобравшийся второй
            # означал бы узел с новым приёмником за старой админкой.
            - name: Build web image
              if: steps.scope.outputs.docs_only != 'true'
              run: |
                  docker build -f deploy/message-bus-web.Dockerfile -t message-bus-web:ci .
