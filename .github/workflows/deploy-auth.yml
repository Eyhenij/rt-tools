name: Deploy Auth

# Выкатка общего Keycloak на его узел. Начинается рукой, как и выкатка приёмника: Keycloak — вход
# всех продуктов, и перезапуск посреди дня выбивает людей из всех админок разом.
#
# Образов своих у Keycloak нет: узел тянет готовые Keycloak, Postgres и Caddy. Отсюда едут состав,
# конфиг дороги, тема входа и область `rt`, собранная из файла стенда. Секреты области и пароли
# живут только в `.env.prod` на узле: файл области несёт подстановки `$(env:…)`, а не значения.
#
# Запуск с ветки собирает тему и область и на этом встаёт: так проверяется правка самого
# конвейера, не трогая узел.
on:
    workflow_dispatch:

concurrency:
    group: auth-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy Keycloak
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.10.0
                  run_install: false

            - name: Cache node_modules
              uses: actions/setup-node@v7
              with:
                  node-version: 22.22.3
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Тема — JAR для каталога `providers`. Сборке нужны Java и Maven: на ubuntu-latest они
            # есть.
            - name: Build the theme and the realm
              run: |
                  pnpm run build:auth-keycloak-theme
                  mkdir -p out/providers out/realm
                  cp dist/auth-keycloak-theme/rt-auth-keycloak-theme.jar out/providers/
                  node tools/auth-realm-prod.mjs --bus-origin https://message-bus.dev > out/realm/rt.json
                  cp deploy/auth/prod/docker-compose.prod.yml deploy/auth/prod/Caddyfile deploy/auth/prod/dump.crontab deploy/dump.sh out/

            - name: Set up SSH
              if: github.ref == 'refs/heads/main'
              env:
                  AUTH_DEPLOY_SSH_KEY: ${{ secrets.AUTH_DEPLOY_SSH_KEY }}
                  AUTH_DEPLOY_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "${AUTH_DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H "${AUTH_DEPLOY_HOST}" >> ~/.ssh/known_hosts

            # Окружение узла, дампы и журнал защищены от удаления. Файлы областей других продуктов
            # кладут их собственные выкатки, поэтому каталог областей тоже не чистится: отсюда
            # перезаписывается только `realm/rt.json`.
            - name: Sync deploy files
              if: github.ref == 'refs/heads/main'
              env:
                  AUTH_DEPLOY_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
                  AUTH_DEPLOY_USER: ${{ secrets.AUTH_DEPLOY_USER }}
              run: |
                  rsync -az --delete \
                      --filter 'P .env.prod' \
                      --filter 'P dumps/' \
                      --filter 'P dump.log' \
                      --filter 'P realm/*' \
                      -e "ssh -i ~/.ssh/deploy_key" \
                      out/ \
                      "${AUTH_DEPLOY_USER}@${AUTH_DEPLOY_HOST}:/opt/auth/"

            - name: Install dump schedule
              if: github.ref == 'refs/heads/main'
              env:
                  AUTH_DEPLOY_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
                  AUTH_DEPLOY_USER: ${{ secrets.AUTH_DEPLOY_USER }}
              run: |
                  ssh -i ~/.ssh/deploy_key "${AUTH_DEPLOY_USER}@${AUTH_DEPLOY_HOST}" \
                      "{ crontab -l 2>/dev/null | grep -v 'dump.sh save'; grep -v '^#' /opt/auth/dump.crontab; } | crontab - \
                      && crontab -l | grep 'dump.sh save'"

            # Поднять состав, дождаться готового Keycloak и наложить области. Наложение с ошибкой
            # роняет выкатку: область, наложенная наполовину, хуже прежней целой.
            - name: Restart stack and apply realms
              if: github.ref == 'refs/heads/main'
              env:
                  AUTH_DEPLOY_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
                  AUTH_DEPLOY_USER: ${{ secrets.AUTH_DEPLOY_USER }}
              run: |
                  ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "${AUTH_DEPLOY_USER}@${AUTH_DEPLOY_HOST}" \
                      "cd /opt/auth \
                      && docker compose -f docker-compose.prod.yml --env-file .env.prod pull db keycloak caddy \
                      && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait --remove-orphans \
                      && docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm keycloak-config"

            # Проба снаружи, по имени: так же, как до Keycloak доходит браузер. Выдавший в ответе
            # должен быть именем входа, иначе токены не сойдутся с настройками приложений.
            - name: Health check
              if: github.ref == 'refs/heads/main'
              run: |
                  want='https://auth.message-bus.dev/realms/rt'
                  for attempt in $(seq 1 12); do
                      if curl -fsS -m 15 "${want}/.well-known/openid-configuration" | grep -q "\"issuer\":\"${want}\""; then
                          echo 'Keycloak отвечает'
                          exit 0
                      fi
                      echo "попытка ${attempt}: Keycloak ещё не отвечает, повтор через 10 с"
                      sleep 10
                  done
                  echo 'Keycloak не ответил за отведённое время'
                  exit 1

            - name: Prune old images
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              env:
                  AUTH_DEPLOY_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
                  AUTH_DEPLOY_USER: ${{ secrets.AUTH_DEPLOY_USER }}
              run: |
                  ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "${AUTH_DEPLOY_USER}@${AUTH_DEPLOY_HOST}" \
                      'docker image prune -f'
