name: Publish @rt-tools/agent-kit to npm

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Specify version: patch, minor, major, or specific version (e.g. 1.2.3)'
                required: true
                default: 'patch'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.22.3]

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
                  token: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.10.0
                  run_install: false

            - name: Cache node_modules
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  registry-url: https://registry.npmjs.org/

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile
                  sudo apt-get install jq

            - name: Update version
              run: |
                  node update-version-agent-kit.cjs ${{ github.event.inputs.version }}
                  pnpm run changelog:agent-kit
                  # Журнал делится тем же движением, которое его растит. Прежде длину его мерил
                  # гейт пуша — то есть после того, как журнал уже приехал в главную ветку: он
                  # встал на 530 строках при пределе 500, и из дерева перестала пушиться любая
                  # ветка, причём у того, кто журнала не трогал.
                  node tools/changelog-split.mjs projects/agent-kit/CHANGELOG.md
                  VERSION=$(jq -r .version projects/agent-kit/package.json)
                  echo "VERSION=$VERSION" >> $GITHUB_ENV

            - name: Build agent-kit
              run: pnpm run build:agent-kit

            # Раскладка идёт до коммита и зовётся собранным пакетом: версия стоит в шапке каждой
            # разложенной копии, и без этого шага сверка раскладки краснеет на главной ветке сразу
            # после публикации — то есть отбивает пуш у всех, пока её не догонит чужая ветка.
            - name: Lay out the new edition into the tree
              run: |
                  node dist/agent-kit/bin/agent-kit.js sync
                  node dist/agent-kit/bin/agent-kit.js sync --check

            # Один коммит на подъём версии, журнал изменений и раскладку: два коммита оставили бы
            # главную ветку в промежуточном состоянии — том самом красном, ради которого шаг заведён.
            - uses: EndBug/add-and-commit@v11
              with:
                  default_author: github_actions
                  message: 'chore(rt:agent-kit): версия пакета поднята до ${{ env.VERSION }} [ci skip]'

            - name: Create git tag
              run: |
                  git tag "rt-agent-kit@${{ env.VERSION }}"
                  git push origin "rt-agent-kit@${{ env.VERSION }}"

            # Импорт из соседа, которого нет в опубликованной версии соседа, ломает сборку у
            # потребителя, а в дереве зелёный: типы читают исходники. Судится строго — выпуск с
            # таким импортом не выходит; сначала публикуется сосед.
            - name: Imports against published neighbours
              run: node tools/check-package-imports.mjs --strict --package @rt-tools/agent-kit

            - name: Publish
              run: pnpm run packagr:agent-kit
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # Замок пересобирается после публикации, а не вместе с версией: подъём вписал
            # зависимым пакетам версию, которой в реестре ещё нет, и до публикации pnpm её не
            # разрешает — так упал первый же выпуск ядра после переноса пересборки в шаг версии.
            # Реестр отдаёт свежую версию с задержкой в секунды, поэтому попыток несколько.
            - name: Rebuild lockfile
              run: |
                  for attempt in 1 2 3 4 5 6; do
                      pnpm install --lockfile-only && break
                      [ "$attempt" = 6 ] && exit 1
                      sleep 20
                  done

            - uses: EndBug/add-and-commit@v11
              with:
                  default_author: github_actions
                  message: 'chore(rt:agent-kit): замок зависимостей пересобран под ${{ env.VERSION }} [ci skip]'
