packages:
  - apps/**
  - libs/**
  - projects/**
verifyDepsBeforeRun: false
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
# Security patches for transitive build-tooling dependencies whose direct parents
# still pin a vulnerable range. None of these ship inside the published packages —
# they exist only in the dev/build graph. Drop an entry once the parent bumps it itself.
overrides:
  '@babel/core': '^7.29.7'
  axios: '^1.18.0'
  'brace-expansion@>=5.0.0 <5.0.7': '^5.0.9'
  esbuild: '^0.28.1'
  'http-proxy-middleware@2': '^2.0.10'
  'http-proxy-middleware@3': '^3.0.7'
  immutable: '^5.1.9'
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  launch-editor: '^2.14.1'
  postcss: '^8.5.25'
  qs: '^6.15.3'
  shell-quote: '^1.9.0'
  svgo: '^4.0.2'
  uuid: '^11.1.1'
  webpack-dev-server: '^5.2.6'
  websocket-driver: '^0.7.5'
  ws: '^8.21.1'
minimumReleaseAgeExclude:
  - '@rt-tools/core@0.0.5 || 0.1.0 || 0.2.0 || 0.3.0'
  - '@rt-tools/store@0.0.6 || 0.0.8 || 0.1.0 || 0.2.0 || 0.3.0'
  - '@rt-tools/utils@0.0.7 || 0.0.9 || 0.1.0 || 0.1.1 || 0.2.0 || 0.3.0 || 0.3.1'
