<div rtBlock="rt-form" qa-dataid="form-dictionary">
    <div rtElem="item" qa-dataid="form-item-contacts">
        <div rtElem="controls">
            <h3 rtElem="title">Контакты</h3>
            <p rtElem="title-descr">Как связаться с гостем, если бронь изменится.</p>

            <div rtElem="control-item">
                <rt-input placeholder="Телефон" />
            </div>

            <div rtElem="control-item">
                <rt-input placeholder="Почта" />
            </div>
        </div>
    </div>

    <div rtElem="item" qa-dataid="form-item-stay">
        <div rtElem="controls">
            <h3 rtElem="title">Проживание</h3>

            <div rtElem="control-item">
                <span rtElem="control-sub-item">
                    <rt-input placeholder="Заезд" />
                </span>
                <span rtElem="control-sub-item">
                    <rt-input placeholder="Отъезд" />
                </span>
            </div>

            <div rtElem="item" qa-dataid="form-item-meals">
                <div rtElem="controls">
                    <h4 rtElem="title">Питание</h4>
                    <p rtElem="title-descr">Вложенный раздел: третьего имени под него нет.</p>

                    <div rtElem="control-item">
                        <rt-input placeholder="Завтрак" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
