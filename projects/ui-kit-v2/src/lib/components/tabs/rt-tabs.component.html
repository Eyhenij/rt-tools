<ng-container rtBlock="rt-tabs">
    <div rtElem="header">
        @if (leftControls().length) {
            <div rtElem="controls" [rtMod]="{ before: true }">
                @for (control of leftControls(); track $index) {
                    <ng-container [ngTemplateOutlet]="control.templateRef" />
                }
            </div>
        }

        <div rtElem="tab-list-wrapper" [rtMod]="{ inline: scrollArrows() === 'inline', overflowing: overflowing() }">
            <div
                rtElem="rest"
                qa-dataid="tabs-scroll-prev"
                [rtMod]="{ before: true, visible: restBeforeVisible(), inactive: !restBeforeVisible() }"
                (mousedown)="onRestPointerDown('before', $event)"
                (mouseup)="onRestPointerUp()"
                (mouseleave)="onRestPointerLeave()">
                <rt-icon name="chevron-left" color="current" size="sm" />
            </div>

            <div
                #tabList
                rtElem="tab-list"
                qa-dataid="tabs-tab-list"
                role="tablist"
                [rtMod]="{ stretch: stretch(), direction: direction(), ink: ink.box() !== null }"
                [attr.aria-orientation]="direction()"
                (scroll)="onTabListScroll()">
                @for (tab of visibleTabs(); track tab.id()) {
                    <button
                        rtBlock="rt-tab-item"
                        qa-dataid="tabs-tab"
                        type="button"
                        role="tab"
                        [rtMod]="{
                            selected: tab.id() === selectedId(),
                            disabled: tab.disabled(),
                            invalid: tab.invalid(),
                            stretch: stretch(),
                        }"
                        [id]="'rt-tab-' + tab.id()"
                        [attr.aria-disabled]="tab.disabled() || null"
                        [attr.aria-label]="tab.ariaLabel()"
                        [attr.aria-keyshortcuts]="tab.showClose() ? 'Delete' : null"
                        [attr.data-tabid]="tab.id()"
                        [attr.aria-selected]="tab.id() === selectedId()"
                        [attr.aria-controls]="headerOnly() ? null : 'rt-tabpanel-' + tab.id()"
                        [attr.tabindex]="tab.id() === focusId() ? 0 : -1"
                        [rtTooltip]="tab.buttonTooltip()"
                        (click)="selectTab(tab.id())"
                        (keydown)="onTabKeydown($event, tab)">
                        @if (tab.icon() || tab.glyph()) {
                            <rt-icon rtElem="icon" size="sm" [name]="tab.icon()" [glyph]="tab.glyph()" [color]="tab.iconColor()" />
                        }

                        @if (tab.titleTemplate(); as titleTpl) {
                            <ng-container [ngTemplateOutlet]="titleTpl" />
                        } @else {
                            <span rtElem="title">{{ tab.label() }}</span>
                        }

                        @if (tab.badge() !== null) {
                            <!-- В одну строку: перенос внутри добавил бы пробел в текст кнопки. -->
                            <!-- prettier-ignore -->
                            <span rtElem="badge" [rtTooltip]="tab.badgeTitle()" [attr.aria-label]="tab.badgeAriaLabel() || null">{{ tab.badge() }}</span>
                        }

                        @if (tab.showClose()) {
                            <!-- Не кнопка: кнопка внутри кнопки-вкладки недопустима. С клавиатуры закрывает Delete. -->
                            <span rtElem="close" qa-dataid="tabs-tab-close" aria-hidden="true" (click)="onCloseClick($event, tab)">
                                <rt-icon name="close" color="current" size="xs" />
                            </span>
                        }
                    </button>
                }

                <!-- Полоса выбранной вкладки — одна на всю полосу: так она переезжает между вкладками. -->
                <span
                    rtElem="ink"
                    aria-hidden="true"
                    [rtMod]="{ placed: ink.box() !== null, animated: ink.animated(), invalid: ink.invalid() }"
                    [style.width.px]="ink.box()?.width"
                    [style.translate]="ink.translate()"></span>
            </div>

            <div
                rtElem="rest"
                qa-dataid="tabs-scroll-next"
                [rtMod]="{ after: true, visible: restAfterVisible(), inactive: !restAfterVisible() }"
                (mousedown)="onRestPointerDown('after', $event)"
                (mouseup)="onRestPointerUp()"
                (mouseleave)="onRestPointerLeave()">
                <rt-icon name="chevron-right" color="current" size="sm" />
            </div>
        </div>

        @if (rightControls().length) {
            <div rtElem="controls" [rtMod]="{ after: true }">
                @for (control of rightControls(); track $index) {
                    <ng-container [ngTemplateOutlet]="control.templateRef" />
                }
            </div>
        }
    </div>

    <!-- Уходящая панель стоит первой и поверх: место ей задаёт замер, сделанный до смены. -->
    @for (panel of panels.list(); track panel.tab.id()) {
        <div
            rtElem="content"
            role="tabpanel"
            [attr.qa-dataid]="panel.leaving ? 'tabs-panel-leaving' : 'tabs-panel'"
            [attr.tabindex]="panel.leaving ? -1 : 0"
            [attr.aria-hidden]="panel.leaving ? 'true' : null"
            [attr.inert]="panel.leaving ? '' : null"
            [rtMod]="{
                scrollable: contentScrollable(),
                leaving: panel.leaving !== null,
                entering: panel.leaving === null && panels.shift() !== null,
                shift: panels.shift(),
            }"
            [style.top.px]="panel.leaving?.top"
            [style.left.px]="panel.leaving?.left"
            [id]="'rt-tabpanel-' + panel.tab.id()"
            [attr.aria-labelledby]="'rt-tab-' + panel.tab.id()"
            (animationend)="panels.animationEnd($event)"
            (animationcancel)="panels.animationEnd($event)">
            <ng-container [ngTemplateOutlet]="panel.tab.templateRef" />
        </div>
    }
</ng-container>
