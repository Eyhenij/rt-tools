@if (state(); as menu) {
    @if (!openedInSheet()) {
        <ng-template
            cdkConnectedOverlay
            cdkConnectedOverlayHasBackdrop
            cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
            [cdkConnectedOverlayOpen]="true"
            [cdkConnectedOverlayOrigin]="menu.point"
            (attach)="onAttach()"
            (backdropClick)="close()"
            (detach)="close()"
            (overlayKeydown)="onKeydown($event)">
            <ng-container [ngTemplateOutlet]="panelTpl" [ngTemplateOutletContext]="{ $implicit: menu }" />
        </ng-template>
    }
}

<!-- Панель одна: у точки нажатия на широком экране, в нижней шторке на телефоне. -->
<ng-template #panelTpl let-menu>
    <div
        rtBlock="rt-tabs-more-menu"
        rtTabsMenuKeys
        role="menu"
        tabindex="-1"
        qa-dataid="tabs-context-menu"
        (click)="close()"
        (keydown.enter)="close()">
        <ng-container [ngTemplateOutlet]="menu.template" [ngTemplateOutletContext]="menu.context" />
    </div>
</ng-template>
