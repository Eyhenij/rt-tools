@if (isShown()) {
    <ng-container rtBlock="rt-data-list-pagination">
        <div rtElem="pages" qa-dataid="data-list-pages">
            <rt-icon-button
                qa-dataid="data-list-page-prev"
                icon="angle-left"
                size="sm"
                [ariaLabel]="prevPageLabel()"
                [tooltip]="prevPageLabel()"
                [disabled]="!prevEnabled()"
                (clicked)="onPageNumber(currentPageModel().pageNumber - 1)" />

            @if (narrow()) {
                <span rtElem="item" qa-dataid="data-list-page" [rtMod]="{ active: true }">{{ currentPageModel().pageNumber }}</span>
            } @else {
                @for (item of items(); track $index) {
                    <span
                        rtElem="item"
                        role="button"
                        tabindex="0"
                        qa-dataid="data-list-page"
                        [rtMod]="{ active: item.active, divider: item.divider, enabled: item.enabled }"
                        (click)="onPageNumber(item.page)"
                        (keydown)="onPageNumber(item.page)">
                        {{ item.label }}
                    </span>
                }
            }

            <rt-icon-button
                qa-dataid="data-list-page-next"
                icon="angle-right"
                size="sm"
                [ariaLabel]="nextPageLabel()"
                [tooltip]="nextPageLabel()"
                [disabled]="!nextEnabled()"
                (clicked)="onPageNumber(currentPageModel().pageNumber + 1)" />
        </div>

        <div rtElem="size">
            @if (!narrow()) {
                <span rtElem="size-title">{{ itemsPerPageLabel() }}</span>
            }

            <rt-select
                qa-dataid="data-list-page-size"
                size="sm"
                [clearable]="false"
                [options]="sizeOptions()"
                [ariaLabel]="itemsPerPageLabel()"
                [ngModel]="currentPageModel().pageSize"
                [ngModelOptions]="{ standalone: true }"
                (selectionChange)="onPageSize($event)" />
        </div>
    </ng-container>
}
