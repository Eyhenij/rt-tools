<rt-aside size="md" [ariaLabel]="title()">
    <!-- Подпись стоит в шапке под заголовком, как у панели первого кита. -->
    <rt-aside-header [title]="title()" [subtitle]="hint()" />

    <ng-container rtBlock="rt-data-list-settings-aside">
        <div rtElem="switches">
            <div rtElem="switch-row">
                <rt-toggle-switch
                    qa-dataid="data-list-settings-vertical"
                    [ariaLabel]="verticalLabel()"
                    [ngModel]="isVerticalScrollbarShown()"
                    [ngModelOptions]="{ standalone: true }"
                    (ngModelChange)="isVerticalScrollbarShown.set($event)" />
                <span rtElem="switch-label" qa-dataid="data-list-settings-vertical-label" [rtMod]="{ on: isVerticalScrollbarShown() }">
                    {{ verticalLabel() }}
                </span>
            </div>

            <div rtElem="switch-row">
                <rt-toggle-switch
                    qa-dataid="data-list-settings-horizontal"
                    [ariaLabel]="horizontalLabel()"
                    [ngModel]="isHorizontalScrollbarShown()"
                    [ngModelOptions]="{ standalone: true }"
                    (ngModelChange)="isHorizontalScrollbarShown.set($event)" />
                <span rtElem="switch-label" qa-dataid="data-list-settings-horizontal-label" [rtMod]="{ on: isHorizontalScrollbarShown() }">
                    {{ horizontalLabel() }}
                </span>
            </div>
        </div>

        <!-- Колонки — плашками первого кита: ручка ✥ и черта, имя, черта и глаз. Общая панель
             колонок кита рисует вид второго кита, и её рисует его собственная таблица. -->
        <ul rtElem="columns" qa-dataid="data-list-settings-columns" cdkDropList (cdkDropListDropped)="onDrop($event)">
            @for (item of items(); track item.key) {
                <li
                    rtElem="column"
                    qa-dataid="data-list-settings-column"
                    cdkDrag
                    [attr.data-key]="item.key"
                    [rtMod]="{ hidden: item.hidden, locked: item.locked === true }"
                    [cdkDragDisabled]="item.locked === true">
                    <button
                        rtElem="handle"
                        qa-dataid="data-list-settings-drag"
                        type="button"
                        cdkDragHandle
                        [disabled]="item.locked === true"
                        [attr.aria-label]="dragLabel()">
                        <rt-icon name="arrows" size="sm" />
                    </button>

                    <span rtElem="column-label" qa-dataid="data-list-settings-column-label">{{ item.label }}</span>

                    <rt-icon-button
                        rtElem="toggle"
                        qa-dataid="data-list-settings-toggle"
                        variant="ghost"
                        [icon]="item.hidden ? 'eye-slash' : 'eye'"
                        [ariaLabel]="item.hidden ? showColumnLabel() : hideColumnLabel()"
                        [tooltip]="item.hidden ? showLabel() : hideLabel()"
                        [disabled]="item.locked === true"
                        (clicked)="onToggleHidden(item.key)" />
                </li>
            }
        </ul>
    </ng-container>

    <rt-aside-footer>
        <!-- Подпись кнопке рисует директива кита, поэтому тело пустое. -->
        <button
            rtButton
            asideDismiss
            type="button"
            appearance="text"
            qa-dataid="data-list-settings-cancel"
            [label]="cancelLabel()"
            (click)="onCancel()">
            <!-- empty: label is drawn by the directive -->
        </button>

        <button
            rtButton
            asidePrimary
            type="button"
            qa-dataid="data-list-settings-save"
            [label]="saveLabel()"
            [disabled]="!isChanged()"
            (click)="onSave()">
            <!-- empty: label is drawn by the directive -->
        </button>
    </rt-aside-footer>
</rt-aside>
