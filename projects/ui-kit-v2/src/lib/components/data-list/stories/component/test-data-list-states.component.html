<app-story-presets caption="Ошибка и свои шаблоны в обоих наборах">
    <ng-template>
        <app-story-row slotWidth="740px" [items]="cases" [itemLabel]="caseLabel">
            <ng-template let-item>
                <app-data-list-states-cell
                    style="display: block; inline-size: 100%"
                    [storageKey]="'story-list-states-' + item.key"
                    [empty]="item.empty"
                    [error]="item.error"
                    [ownEmpty]="item.ownEmpty"
                    [ownError]="item.ownError" />
            </ng-template>
        </app-story-row>
    </ng-template>
</app-story-presets>
