<ng-container rtBlock="rt-bottom-sheet">
    <button
        type="button"
        rtElem="backdrop"
        qa-dataid="bottom-sheet-backdrop"
        [attr.aria-label]="t().bottomSheetClose"
        [attr.inert]="confirming() ? '' : null"
        (click)="dismiss()"></button>
    <!-- Пока показан вопрос, панель под ним недоступна: Tab ходит только по ответам. -->
    <div
        rtElem="panel"
        qa-dataid="bottom-sheet-panel"
        role="dialog"
        aria-modal="true"
        tabindex="-1"
        [attr.aria-labelledby]="ariaLabelledby()"
        [attr.aria-label]="ariaLabel()"
        [attr.inert]="confirming() ? '' : null"
        [rtMod]="{ dragging: dragging(), full: fullHeight(), typing: raised() }"
        [style.transform]="dragging() ? 'translateY(' + dragDeltaY() + 'px)' : null"
        (focusin)="onFocusIn($event)">
        <div rtElem="handle" qa-dataid="bottom-sheet-handle" (pointerdown)="onDragStart($event)"></div>
        @if (headerTpl(); as ownHeader) {
            <div rtElem="header" qa-dataid="bottom-sheet-header" [rtMod]="{ own: true }">
                <ng-container [ngTemplateOutlet]="ownHeader" [ngTemplateOutletContext]="templateContext" />
            </div>
        } @else {
            <div rtElem="header" qa-dataid="bottom-sheet-header">
                <div rtElem="start">
                    <!-- Второй экран шторки возвращается к первому шевроном «назад» на месте «×». -->
                    <rt-icon-button
                        variant="secondary"
                        radius="full"
                        [attr.qa-dataid]="nested() ? 'bottom-sheet-back' : 'bottom-sheet-close'"
                        [icon]="nested() ? 'chevron-left' : 'ico-close'"
                        [ariaLabel]="nested() ? t().uiBack : t().bottomSheetClose"
                        (clicked)="dismiss()" />
                </div>
                <div rtElem="title" qa-dataid="bottom-sheet-title">
                    <ng-content select="[sheetHeader]" />
                </div>
                <div rtElem="action" qa-dataid="bottom-sheet-action">
                    <ng-content select="[sheetAction]" />
                </div>
            </div>
        }
        <div rtElem="body" qa-dataid="bottom-sheet-body">
            <ng-content />
        </div>
        <div rtElem="footer" qa-dataid="bottom-sheet-footer">
            @if (footerTpl(); as ownFooter) {
                <ng-container [ngTemplateOutlet]="ownFooter" [ngTemplateOutletContext]="templateContext" />
            } @else {
                <ng-content select="[sheetFooter]" />
            }
        </div>
    </div>
    @if (confirming()) {
        <div rtElem="confirm" qa-dataid="bottom-sheet-confirm" role="alertdialog" aria-modal="true" [attr.aria-labelledby]="confirmTitleId">
            <!-- Две карточки, как лист действий телефона: вопрос с отказом и согласием, ниже отдельно «остаться».
                 Фокус встаёт на согласие, как прежде; Tab идёт по строкам сверху вниз. -->
            <div rtElem="confirm-card" qa-dataid="bottom-sheet-confirm-card">
                <div rtElem="confirm-heading">
                    <h2 rtElem="confirm-title" qa-dataid="bottom-sheet-confirm-title" [attr.id]="confirmTitleId">
                        {{ confirmText().title }}
                    </h2>
                    <p rtElem="confirm-message" qa-dataid="bottom-sheet-confirm-message">{{ confirmText().message }}</p>
                </div>
                <button
                    rtElem="confirm-row"
                    qa-dataid="bottom-sheet-confirm-discard"
                    type="button"
                    [rtMod]="{ danger: true }"
                    (click)="onConfirmDiscard()">
                    {{ confirmText().discard }}
                </button>
                <button #confirmFirst rtElem="confirm-row" qa-dataid="bottom-sheet-confirm-apply" type="button" (click)="onConfirmApply()">
                    {{ confirmText().apply }}
                </button>
            </div>
            <div rtElem="confirm-card" qa-dataid="bottom-sheet-confirm-stay-card">
                <button
                    rtElem="confirm-row"
                    qa-dataid="bottom-sheet-confirm-cancel"
                    type="button"
                    [rtMod]="{ stay: true }"
                    (click)="onConfirmCancel()">
                    {{ confirmText().stay }}
                </button>
            </div>
        </div>
    }
</ng-container>
