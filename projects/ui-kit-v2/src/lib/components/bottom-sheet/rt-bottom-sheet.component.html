<ng-container rtBlock="rt-bottom-sheet">
    <button
        type="button"
        rtElem="backdrop"
        qa-dataid="bottom-sheet-backdrop"
        [attr.aria-label]="t().bottomSheetClose"
        (click)="dismiss()"></button>
    <div
        rtElem="panel"
        qa-dataid="bottom-sheet-panel"
        role="dialog"
        aria-modal="true"
        [rtMod]="{ dragging: dragging() }"
        [style.transform]="dragging() ? 'translateY(' + dragDeltaY() + 'px)' : null">
        <div rtElem="handle" qa-dataid="bottom-sheet-handle" (pointerdown)="onDragStart($event)"></div>
        <div rtElem="header" qa-dataid="bottom-sheet-header">
            <ng-content select="[sheetHeader]" />
        </div>
        <div rtElem="body" qa-dataid="bottom-sheet-body">
            <ng-content />
        </div>
        <div rtElem="footer" qa-dataid="bottom-sheet-footer">
            <ng-content select="[sheetFooter]" />
        </div>
    </div>
</ng-container>
