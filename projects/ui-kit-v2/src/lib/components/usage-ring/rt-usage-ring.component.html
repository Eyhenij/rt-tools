<ng-container rtBlock="rt-usage-ring">
    <span
        rtElem="ring"
        role="img"
        qa-dataid="usage-ring"
        rtTooltipShowOnTap
        [rtMod]="mods()"
        [attr.aria-label]="label()"
        [attr.data-percent]="percent()"
        [attr.tabindex]="hint() ? 0 : null"
        [rtTooltip]="hint()">
        <svg rtElem="svg" viewBox="0 0 18 18" aria-hidden="true">
            <circle rtElem="track" cx="9" cy="9" [attr.r]="radius" />
            <circle
                rtElem="arc"
                cx="9"
                cy="9"
                [attr.r]="radius"
                [attr.stroke-dasharray]="circumference"
                [attr.stroke-dashoffset]="dashOffset()" />
        </svg>
    </span>
</ng-container>
