<ng-container rtBlock="rt-input-number">
    @if (isReadonly()) {
        <span rtElem="readonly" qa-dataid="input-number-readonly" [rtMod]="{ empty: !displayText() }">
            @if (prefix() && displayText()) {
                <span rtElem="prefix" qa-dataid="input-number-prefix">{{ prefix() }}</span>
            }
            {{ displayText() || '—' }}
        </span>
    } @else {
        @if (iconLeft(); as left) {
            <rt-icon rtElem="icon-left" size="sm" color="muted" [name]="left" />
        }
        @if (prefix(); as pfx) {
            <span rtElem="prefix" qa-dataid="input-number-prefix" aria-hidden="true">{{ pfx }}</span>
        }
        <input
            #fieldEl
            rtElem="field"
            qa-dataid="input-number-control"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            [attr.id]="effectiveControlId()"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-invalid]="isInvalid() || null"
            [attr.placeholder]="placeholder()"
            [disabled]="isDisabled()"
            [value]="displayValue()"
            (input)="onInput($event)"
            (keydown)="onKeydown($event)"
            (blur)="onBlur()" />
        @if (showClearButton()) {
            <rt-icon-button
                rtElem="clear"
                qa-dataid="input-number-clear"
                icon="ico-close"
                size="sm"
                variant="ghost"
                iconColor="muted"
                [ariaLabel]="t().uiClear"
                [tabIndex]="clearTabIndex()"
                (clicked)="clear($event)" />
        }
        @if (stepper()) {
            <span rtElem="stepper" qa-dataid="input-number-stepper">
                <button
                    type="button"
                    rtElem="step"
                    qa-dataid="input-number-step-up"
                    tabindex="-1"
                    [attr.aria-label]="t().uiIncrease"
                    [disabled]="!canStepUp()"
                    (click)="stepBy(1)">
                    <rt-icon rtElem="step-icon" name="chevron-up" size="xs" />
                </button>
                <button
                    type="button"
                    rtElem="step"
                    qa-dataid="input-number-step-down"
                    tabindex="-1"
                    [attr.aria-label]="t().uiDecrease"
                    [disabled]="!canStepDown()"
                    (click)="stepBy(-1)">
                    <rt-icon rtElem="step-icon" name="chevron-down" size="xs" />
                </button>
            </span>
        }
    }
</ng-container>
