<ng-container rtBlock="rt-multiselect">
    @if (isReadonly()) {
        <span rtElem="readonly" qa-dataid="multiselect-readonly" [rtMod]="{ empty: !displayText() }">{{ displayText() || '—' }}</span>
    }
    <button
        #triggerEl
        rtElem="trigger"
        qa-dataid="multiselect-trigger"
        type="button"
        [rtPopoverWidth]="panelWidth()"
        [rtMod]="{ own: !!triggerTpl() }"
        [rtPopover]="panelTpl"
        [rtPopoverDisabled]="isDisabled()"
        [attr.id]="effectiveControlId()"
        [attr.aria-label]="ariaLabel()"
        [attr.aria-haspopup]="'listbox'"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-invalid]="isInvalid() || null"
        [attr.aria-controls]="panelId"
        [attr.aria-activedescendant]="activeOptionId()"
        [disabled]="isDisabled()"
        (keydown)="onTriggerKeydown($event)"
        (rtPopoverOpened)="onOpened()"
        (rtPopoverClosed)="onClosed()">
        <!--
            Разметка указателя: своя, если потребитель её объявил, иначе зашитая китом. Она встаёт
            внутрь кнопки, а не вместо неё: поведение — открытие панели, приметы доступности,
            отключённость, клавиши и закрытие — остаётся на кнопке кита.
        -->
        @if (triggerTpl(); as tpl) {
            <ng-container [ngTemplateOutlet]="tpl.templateRef" [ngTemplateOutletContext]="{ $implicit: triggerState() }" />
        } @else {
            @if (iconLeft(); as left) {
                <rt-icon rtElem="icon-left" qa-dataid="multiselect-icon-left" size="sm" color="muted" [name]="left" />
            }
            @if (value().length === 0) {
                <span rtElem="placeholder" qa-dataid="multiselect-placeholder">{{ placeholderText() }}</span>
            } @else {
                <span rtElem="chips">
                    @for (val of visibleChips(); track val) {
                        <span rtElem="chip" qa-dataid="multiselect-chip" [attr.data-value]="val">
                            <rt-tag
                                severity="info"
                                [value]="val | rtMultiselectLabel: options()"
                                [closable]="true"
                                (closed)="removeChip(val, $event)" />
                        </span>
                    }
                    @if (extraChipsCount() > 0) {
                        <span rtElem="chip-more" qa-dataid="multiselect-chip-more">+{{ extraChipsCount() }}</span>
                    }
                </span>
            }
            @if (showClearButton()) {
                <rt-icon-button
                    rtElem="clear"
                    qa-dataid="multiselect-clear"
                    icon="ico-close"
                    size="sm"
                    variant="ghost"
                    iconColor="muted"
                    [ariaLabel]="t().uiClear"
                    [tabIndex]="-1"
                    (clicked)="clear($event)" />
            }
            <rt-icon rtElem="chevron" name="chevron-down" size="sm" color="muted" />
        }
    </button>

    <ng-template #panelTpl>
        <div
            rtElem="panel"
            qa-dataid="multiselect-panel"
            role="listbox"
            [style.--rt-multiselect-panel-max-height]="panelMaxHeight()"
            [attr.aria-label]="ariaLabel()">
            <!--
                Опции выбираются мышью через (click); keyboard-nav — на trigger'е
                (activedescendant), опции не focusable индивидуально.
            -->
            <!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
            <ul rtElem="list">
                @for (row of rows(); track row.option.value; let i = $index) {
                    <li
                        rtElem="option"
                        qa-dataid="multiselect-option"
                        role="option"
                        [id]="panelId + '-opt-' + i"
                        [attr.data-value]="row.option.value"
                        [attr.aria-level]="isTree() ? row.level + 1 : null"
                        [style.--rt-multiselect-tree-level]="row.level"
                        [rtMod]="{
                            selected: rowChecks()[i] === 'all',
                            active: i === activeIndex(),
                            disabled: !!row.option.disabled,
                        }"
                        [attr.aria-selected]="rowChecks()[i] === 'all'"
                        [attr.aria-disabled]="!!row.option.disabled"
                        (click)="toggleOption(row.option)">
                        @if (isTree()) {
                            @if (row.branch) {
                                <button
                                    rtElem="toggle"
                                    qa-dataid="multiselect-option-toggle"
                                    type="button"
                                    tabindex="-1"
                                    [attr.aria-label]="row.open ? t().uiCollapse : t().uiExpand"
                                    [attr.aria-expanded]="row.open"
                                    (click)="toggleBranch($event, row.option.value)">
                                    <rt-icon size="sm" color="muted" [name]="row.open ? 'chevron-down' : 'chevron-right'" />
                                </button>
                            } @else {
                                <span rtElem="toggle-space"></span>
                            }
                        }
                        <input
                            rtElem="checkbox"
                            qa-dataid="multiselect-option-checkbox"
                            type="checkbox"
                            tabindex="-1"
                            [checked]="rowChecks()[i] === 'all'"
                            [indeterminate]="rowChecks()[i] === 'some'" />
                        <span rtElem="option-label" qa-dataid="multiselect-option-label">{{ row.option.label }}</span>
                    </li>
                } @empty {
                    <li rtElem="empty" qa-dataid="multiselect-empty">{{ t().uiNoOptions }}</li>
                }
            </ul>
        </div>
    </ng-template>
</ng-container>
