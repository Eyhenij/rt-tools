<ng-container rtBlock="rt-pagination">
    <!--
        Ветки «ничего не найдено» здесь нет намеренно: пустой набор прячет весь
        бар целиком (`isVisible`), так что до этой строки дело не доходит. Пока
        такая ветка тут висела, она читалась как рабочее состояние, а показать
        её было нельзя ни при каких входах.
    -->
    <span rtElem="range" qa-dataid="pagination-range">
        {{ rangeLabel() }}
    </span>

    @if (pageItems().length) {
        <nav rtElem="compact" qa-dataid="pagination-compact" [attr.aria-label]="t().uiPagination">
            <rt-icon-button
                rtElem="arrow"
                qa-dataid="pagination-compact-prev"
                icon="chevron-left"
                variant="ghost"
                size="sm"
                [ariaLabel]="t().uiPrevPage"
                [tooltip]="t().uiBack"
                [disabled]="isFirst() || loading()"
                (clicked)="goTo(pageModel().pageNumber - 1)" />

            <span rtElem="compact-label" qa-dataid="pagination-compact-label">
                {{ pageLabel() }}
            </span>

            <rt-icon-button
                rtElem="arrow"
                qa-dataid="pagination-compact-next"
                icon="chevron-right"
                variant="ghost"
                size="sm"
                [ariaLabel]="t().uiNextPage"
                [tooltip]="t().uiForward"
                [disabled]="isLast() || loading()"
                (clicked)="goTo(pageModel().pageNumber + 1)" />
        </nav>

        <nav rtElem="nav" qa-dataid="pagination-nav" [attr.aria-label]="t().uiPagination">
            <rt-icon-button
                rtElem="arrow"
                qa-dataid="pagination-prev"
                icon="chevron-left"
                variant="ghost"
                size="sm"
                [ariaLabel]="t().uiPrevPage"
                [tooltip]="t().uiBack"
                [disabled]="isFirst() || loading()"
                (clicked)="goTo(pageModel().pageNumber - 1)" />

            @for (item of pageItems(); track $index) {
                @if (item === 'gap') {
                    <span rtElem="gap" aria-hidden="true">…</span>
                } @else {
                    <button
                        rtElem="page"
                        qa-dataid="pagination-page"
                        type="button"
                        [attr.data-page]="item"
                        [rtMod]="{ current: item === pageModel().pageNumber }"
                        [attr.aria-current]="item === pageModel().pageNumber ? 'page' : null"
                        [disabled]="loading()"
                        (click)="goTo(item)">
                        {{ item }}
                    </button>
                }
            }

            <rt-icon-button
                rtElem="arrow"
                qa-dataid="pagination-next"
                icon="chevron-right"
                variant="ghost"
                size="sm"
                [ariaLabel]="t().uiNextPage"
                [tooltip]="t().uiForward"
                [disabled]="isLast() || loading()"
                (clicked)="goTo(pageModel().pageNumber + 1)" />
        </nav>
    }

    <div rtElem="per-page">
        <span rtElem="per-page-label">{{ t().uiPerPage }}</span>
        <rt-select
            qa-dataid="pagination-per-page"
            [ariaLabel]="t().uiItemsPerPage"
            [options]="perPageSelectOptions()"
            [clearable]="false"
            [ngModel]="pageModel().pageSize"
            [ngModelOptions]="{ standalone: true }"
            (selectionChange)="onPerPage($event)" />
    </div>
</ng-container>
