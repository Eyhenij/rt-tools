<ng-container rtBlock="rt-toggle-switch">
    <button
        rtBlock="rt-toggle-switch"
        qa-dataid="toggle-switch-control"
        type="button"
        role="switch"
        [rtMod]="bemMods()"
        [attr.id]="label() ? controlId() : inputId()"
        [attr.aria-checked]="isOn()"
        [attr.aria-label]="ariaLabel()"
        [attr.aria-labelledby]="label() ? labelId : null"
        [disabled]="isDisabled()"
        (click)="toggle()">
        <span rtElem="track">
            @if (iconOff(); as iconOffName) {
                <rt-icon rtElem="icon-off" size="sm" [name]="iconOffName" />
            }
            @if (iconOn(); as iconOnName) {
                <rt-icon rtElem="icon-on" size="sm" [name]="iconOnName" />
            }
            <span rtElem="thumb"></span>
        </span>
    </button>
    @if (label(); as labelText) {
        <label rtElem="label" qa-dataid="toggle-switch-label" [attr.id]="labelId" [attr.for]="controlId()">{{ labelText }}</label>
    }
</ng-container>
