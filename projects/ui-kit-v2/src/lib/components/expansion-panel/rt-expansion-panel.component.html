<ng-container rtBlock="rt-expansion-panel">
    <!-- Строка заголовка: кнопка-переключатель, а при действиях — они и шеврон после неё. Действия
         вне кнопки: кнопка внутри кнопки недопустима, и нажатие по действию не раскрывает панель. -->
    <div rtElem="head">
        <button
            type="button"
            rtElem="header"
            qa-dataid="expansion-panel-header"
            [id]="headerDomId()"
            [disabled]="disabled()"
            [attr.aria-expanded]="expanded()"
            [attr.aria-controls]="bodyRendered() ? bodyId : null"
            [attr.aria-label]="ariaLabel()"
            (click)="toggle()">
            <ng-content />

            @if (!hideToggle() && !actions()) {
                <!-- Шеврон — в обёртке: ширину столбца держит она, значок свою ширину ставит сам. -->
                <span rtElem="chevron" aria-hidden="true" [rtMod]="{ open: expanded() }"><rt-icon size="sm" name="chevron-down" /></span>
            }
        </button>

        @if (actions()) {
            <div rtElem="actions" qa-dataid="expansion-panel-actions">
                <ng-content select="[rtExpansionPanelActions]" />
            </div>

            @if (!hideToggle()) {
                <!-- Шеврон вне кнопки нажимается мышью; с клавиатуры панель раскрывает сама кнопка. -->
                <span
                    rtElem="chevron"
                    qa-dataid="expansion-panel-chevron"
                    aria-hidden="true"
                    [rtMod]="{ open: expanded(), outside: true }"
                    (click)="toggle()">
                    <rt-icon size="sm" name="chevron-down" />
                </span>
            }
        }
    </div>

    @if (bodyRendered()) {
        <!-- Сворачивание доигрывает движение: класс ухода сводит высоту к нулю, и тело уходит после. -->
        <div
            rtElem="body"
            role="region"
            qa-dataid="expansion-panel-body"
            animate.leave="rt-expansion-panel__body--leaving"
            [rtMod]="{ collapsed: !expanded() }"
            [attr.inert]="expanded() ? null : ''"
            [id]="bodyId"
            [attr.aria-labelledby]="headerDomId()">
            <ng-content select="[rtExpansionPanelBody]" />

            @if (lazyContent(); as content) {
                <ng-container [ngTemplateOutlet]="content.templateRef" />
            }
        </div>
    }
</ng-container>
