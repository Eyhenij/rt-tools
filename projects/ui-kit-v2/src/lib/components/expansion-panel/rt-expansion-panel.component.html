<ng-container rtBlock="rt-expansion-panel">
    <!-- Строка заголовка: кнопка-переключатель, а при действиях — они и шеврон после неё. Действия
         вне кнопки: кнопка внутри кнопки недопустима, и нажатие по действию не раскрывает панель. -->
    <div rtElem="head">
        <button
            type="button"
            rtElem="header"
            qa-dataid="expansion-panel-header"
            [id]="headerDomId()"
            [disabled]="disabled()"
            [attr.aria-expanded]="expanded()"
            [attr.aria-controls]="bodyId"
            [attr.aria-label]="ariaLabel()"
            (click)="toggle()">
            <!-- Элементы прежней формы действий сюда не попадают: они не рисуются и только предупреждают. -->
            <ng-content select=":not([rtExpansionPanelActions]):not([rtExpansionPanelBody])" />

            @if (!hideToggle() && !actions().length) {
                <!-- Шеврон — в обёртке: ширину столбца держит она, значок свою ширину ставит сам. -->
                <span rtElem="chevron" aria-hidden="true" [rtMod]="{ open: expanded() }"><rt-icon size="sm" name="chevron-down" /></span>
            }
        </button>

        @if (actions().length) {
            <div rtElem="actions" qa-dataid="expansion-panel-actions">
                @for (action of actions(); track action) {
                    <ng-container [ngTemplateOutlet]="action" />
                }
            </div>

            @if (!hideToggle()) {
                <!-- Шеврон вне кнопки нажимается мышью; с клавиатуры панель раскрывает сама кнопка. -->
                <span
                    rtElem="chevron"
                    qa-dataid="expansion-panel-chevron"
                    aria-hidden="true"
                    [rtMod]="{ open: expanded(), outside: true }"
                    (click)="toggle()">
                    <rt-icon size="sm" name="chevron-down" />
                </span>
            }
        }
    </div>

    <!-- Узел тела стоит в разметке с начала: свёрнутое скрыто и inert, поля формы в нём остаются во
         внешней форме. Высоту сворачивания ведёт модификатор collapsed. -->
    <div
        rtElem="body"
        role="region"
        qa-dataid="expansion-panel-body"
        [rtMod]="{ collapsed: !expanded() }"
        [attr.inert]="expanded() ? null : ''"
        [id]="bodyId"
        [attr.aria-labelledby]="headerDomId()">
        <ng-content select="[rtExpansionPanelBody]" />

        @if (lazyRendered() && lazyContent(); as content) {
            <!-- Ленивое тело уходит после того, как сворачивание доиграло: тело уходит с содержимым, а не пустым. -->
            <div rtElem="lazy" animate.leave="rt-expansion-panel__lazy--leaving">
                <ng-container [ngTemplateOutlet]="content.templateRef" />
            </div>
        }
    </div>
</ng-container>
