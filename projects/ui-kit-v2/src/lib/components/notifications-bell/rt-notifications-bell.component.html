<button rtBlock="rt-notifications-bell" type="button" qa-dataid="header-bell" [attr.aria-label]="ariaLabel()" (click)="onClick()">
    <rt-icon rtElem="icon" name="bell" size="sm" />

    @if (unread()) {
        <span rtElem="marker" role="img" qa-dataid="header-bell-marker" [attr.aria-label]="unreadLabel()"></span>
    }
</button>
