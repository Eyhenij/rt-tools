<app-story-presets fill caption="Обрезка изображения в обоих наборах">
    <ng-template>
        <rt-file-drop accept="image/*" (filesDropped)="onDropped($event)">
            <rt-image-cropper
                [file]="file()"
                [ratio]="ratio"
                [round]="round"
                [minSize]="minSize"
                [format]="format"
                [quality]="quality"
                [disabled]="disabled"
                (cropped)="onCropped($event)"
                (loadFailed)="onFailed()" />
        </rt-file-drop>
        <p>{{ summary() }}</p>
        @if (preview(); as src) {
            <img alt="" width="192" [src]="src" />
        }
    </ng-template>
</app-story-presets>
