<ng-container rtBlock="rt-header">
    <div rtElem="content">
        <rt-icon-button
            rtElem="back"
            qa-dataid="header-back"
            icon="arrow-left"
            variant="ghost"
            size="md"
            shape="circle"
            [ariaLabel]="t().uiBack"
            [tooltip]="t().uiBack"
            [rtMod]="{ visible: canGoBack() }"
            (clicked)="onBackClick()" />

        <div rtElem="logo" qa-dataid="header-logo">
            <rt-logo variant="wordmark" height="15" />
        </div>

        @if (showInvite()) {
            <rt-icon-button
                rtElem="action"
                qa-dataid="header-invite"
                icon="user-plus"
                variant="ghost"
                size="md"
                shape="circle"
                style="--rt-icon-button-size: 35px"
                [ariaLabel]="t().uiInviteUser"
                [tooltip]="t().uiInviteUser"
                (clicked)="onInviteClick()" />
        }

        <ng-content select="[rtHeaderBell]" />

        <rt-icon-button
            rtElem="action"
            qa-dataid="header-profile"
            icon="user"
            variant="ghost"
            size="md"
            shape="circle"
            style="--rt-icon-button-size: 35px"
            [ariaLabel]="t().uiProfile"
            [tooltip]="t().uiProfile"
            (clicked)="onProfileClick()" />
    </div>
</ng-container>
