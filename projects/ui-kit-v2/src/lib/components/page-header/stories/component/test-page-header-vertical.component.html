<div data-story-root class="app-rail-screen" [attr.data-story-trigger]="overlay ? '' : null" [style.height.px]="screenHeight">
    <rt-page-header
        layout="vertical"
        [items]="sections"
        [user]="user"
        [userMenu]="profileMenu"
        [railFoot]="phone() || tabs === 0"
        [railActions]="railActions"
        (itemClick)="onAction($event)">
        <span rtRailLogo class="app-rail-screen__logo"></span>
        @if (phone()) {
            <ng-container ngProjectAs="[rtRailPage]">
                <ng-container [ngTemplateOutlet]="barTpl" />
            </ng-container>
        }
    </rt-page-header>

    <div class="app-rail-screen__rest">
        @if (tabs > 0) {
            <rt-tabs
                class="app-rail-screen__tabs"
                closeOn="selected"
                headerOnly
                [overflow]="overflow"
                [activeId]="pickedTab() ?? (tabs > 1 ? 'tab-2' : 'tab-1')"
                (activeIdChange)="pickedTab.set($event)">
                @for (tab of tabList; track tab) {
                    <ng-template
                        [rtTab]="'tab-' + tab"
                        [label]="tabLabels[tab - 1] || 'Вкладка ' + tab"
                        [pinned]="tabs > 1 && tab === 1"
                        [closable]="tabs > 1"
                        [contextMenu]="tabMenu">
                        <span></span>
                    </ng-template>
                }
                @if (!phone()) {
                    <ng-template rtTabsControl>
                        <rt-page-actions [items]="railActions" [user]="user" [userMenu]="profileMenu" (itemClick)="onAction($event)" />
                    </ng-template>
                }
            </rt-tabs>
        }
        @if (bar && !phone()) {
            <ng-container [ngTemplateOutlet]="barTpl" />
        }
        <main class="app-rail-screen__page">
            <app-page-table [phone]="phone()" />
        </main>
    </div>

    @if (assistantOpen) {
        <aside class="app-rail-screen__assistant" data-qa="assistant">
            <rt-ai-chat
                title="Ассистент"
                subtitle="Отвечает по данным организации"
                placeholder="Спросите ассистента…"
                disclaimer="Ассистент может ошибаться."
                model="Opus 5.5"
                effort="Medium"
                mode="Auto"
                closable
                [fullScreenable]="!phone()"
                [usage]="assistantUsage"
                [messages]="assistantMessages"
                [threads]="[]"
                (closed)="assistantPicked.set(false)" />
        </aside>
    }
</div>

<ng-template #tabMenu>
    <rt-menu-item label="Закрепить" icon="pin" />
    <rt-menu-item label="Закрыть" icon="close" />
</ng-template>

<ng-template #profileMenu>
    <rt-profile-menu
        userName="Анна Смирнова"
        organizationName="Вилла Лотос"
        organizationChange="allowed"
        passwordChange
        locale="ru"
        [locales]="profileLocales" />
</ng-template>

<ng-template #barTpl>
    @if (bar) {
        <rt-page-bar [pageTitle]="pageTitle" [actions]="barActions" [filtersActive]="filtersActive">
            <ng-template rtPageBarSearch>
                <rt-input iconLeft="search" [placeholder]="searchPlaceholder" [size]="phone() ? 'md' : 'sm'" />
            </ng-template>
            @for (name of shownFilters; track name) {
                <ng-template rtPageBarFilter>
                    <rt-select [placeholder]="name" [options]="options" [size]="phone() ? 'md' : 'sm'" />
                </ng-template>
            }
        </rt-page-bar>
    }
</ng-template>
