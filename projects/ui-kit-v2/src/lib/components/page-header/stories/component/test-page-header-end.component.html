<div class="app-page-header-end" [attr.data-theme]="theme">
    <div class="app-page-header-end__case">
        <span class="app-page-header-end__label">одна кнопка</span>
        <rt-page-header ariaLabel="Разделы" [items]="items" [user]="user">
            <ng-template rtHeaderBell>
                <rt-notifications-bell ariaLabel="Уведомления" unreadLabel="Есть непрочитанные" unread />
            </ng-template>
        </rt-page-header>
    </div>
    <div class="app-page-header-end__case">
        <span class="app-page-header-end__label">две кнопки</span>
        <rt-page-header ariaLabel="Разделы" [items]="items" [user]="user">
            <ng-template rtHeaderBell><rt-notifications-bell icon="sparkle" ariaLabel="Помощник" /></ng-template>
            <ng-template rtHeaderBell>
                <rt-notifications-bell ariaLabel="Уведомления" unreadLabel="Есть непрочитанные" unread />
            </ng-template>
        </rt-page-header>
    </div>
</div>
