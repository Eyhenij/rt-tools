<div
    rtBlock="rt-toggle-button-group"
    role="group"
    [rtMod]="{
        sm: size() === 'sm',
        md: size() === 'md',
        lg: size() === 'lg',
        disabled: disabled(),
    }"
    [attr.aria-label]="ariaLabel()">
    @for (option of options(); track option.value) {
        <button
            type="button"
            rtElem="button"
            qa-dataid="toggle-button-group-option"
            [attr.data-value]="option.value"
            [rtMod]="{
                active: value() === option.value,
                first: $first,
                last: $last,
            }"
            [disabled]="disabled()"
            [attr.aria-pressed]="value() === option.value ? 'true' : 'false'"
            [rtTooltip]="option.title ?? ''"
            (click)="onOptionClick(option)">
            @if (option.icon) {
                <rt-icon rtElem="icon" color="current" [name]="option.icon" [size]="iconSize()" />
            }
            <span rtElem="label">{{ option.label }}</span>
        </button>
    }
</div>
