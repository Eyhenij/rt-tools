<div
    rtBlock="rt-toggle-button-group"
    role="group"
    [rtMod]="{
        sm: size() === 'sm',
        md: size() === 'md',
        lg: size() === 'lg',
        disabled: isDisabled(),
        wrap: layout() === 'wrap',
        column: layout() === 'column',
        chips: appearance() === 'chips',
    }"
    [attr.aria-label]="ariaLabel()">
    @for (item of items(); track item.option.value) {
        <button
            type="button"
            rtElem="button"
            qa-dataid="toggle-button-group-option"
            [attr.data-value]="item.option.value"
            [rtMod]="{
                active: item.active,
                first: $first,
                last: $last,
                checked: checkmark() && item.active,
            }"
            [disabled]="item.disabled"
            [attr.aria-pressed]="item.active ? 'true' : 'false'"
            [rtTooltip]="item.option.title ?? ''"
            (click)="onOptionClick(item)">
            @if (checkmark() && item.active) {
                <span rtElem="check" aria-hidden="true">
                    <svg rtElem="check-svg" viewBox="-2 -3 30 30" focusable="false">
                        <path fill="none" stroke="currentColor" d="M1.73,12.91 8.1,19.28 22.79,4.59" />
                    </svg>
                </span>
            }
            @if (optionTpl(); as tpl) {
                <ng-container [ngTemplateOutlet]="tpl.templateRef" [ngTemplateOutletContext]="item.context" />
            } @else {
                @if (item.option.icon || item.option.glyph) {
                    <rt-icon
                        rtElem="icon"
                        color="current"
                        [name]="item.option.icon ?? null"
                        [glyph]="item.option.glyph ?? null"
                        [size]="iconSize()" />
                }
                <span rtElem="label">{{ item.option.label }}</span>
            }
        </button>
    }
</div>
