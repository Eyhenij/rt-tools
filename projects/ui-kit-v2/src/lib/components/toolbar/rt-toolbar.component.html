@if (leftTpl() || centerTpl() || rightTpl() || filtersTpl()) {
    <ng-container rtBlock="rt-toolbar">
        <div rtElem="bars">
            @if (leftTpl() || filtersInBar()) {
                <div rtElem="bar" qa-dataid="toolbar-bar" data-slot="left" [rtMod]="{ left: true }">
                    <ng-container [ngTemplateOutlet]="leftTpl() ?? null" />

                    <!-- На широком месте отборы стоят в полосе сами, после содержимого левой секции -->
                    @if (filtersInBar()) {
                        <ng-container [ngTemplateOutlet]="filtersTpl() ?? null" [ngTemplateOutletContext]="{ $implicit: 'bar' }" />
                    }
                </div>
            }

            @if (centerTpl()) {
                <div rtElem="bar" qa-dataid="toolbar-bar" data-slot="center" [rtMod]="{ center: true }">
                    <ng-container [ngTemplateOutlet]="centerTpl() ?? null" />
                </div>
            }

            @if (rightTpl() || collapsed()) {
                <div rtElem="bar" qa-dataid="toolbar-bar" data-slot="right" [rtMod]="{ right: true }">
                    <!-- На узком месте отборы уходят за кнопку: она первая в ряду кнопок полосы -->
                    @if (collapsed()) {
                        <rt-icon-button
                            rtElem="filters-trigger"
                            qa-dataid="toolbar-filters-trigger"
                            icon="filter"
                            variant="primary"
                            [ariaLabel]="filtersLabel()"
                            [tooltip]="filtersLabel()"
                            [indicator]="filtersActive()"
                            (clicked)="openFilters()" />
                    }

                    <ng-container [ngTemplateOutlet]="rightTpl() ?? null" />
                </div>
            }
        </div>
    </ng-container>
}
