<ng-container rtBlock="rt-action-bar-holder">
    @if (shown()) {
        <rt-action-bar
            rtElem="bar"
            qa-dataid="action-bar-holder-bar"
            [rtMod]="{ leaving: leaving() }"
            [config]="config()"
            [closeIcon]="closeIcon()"
            (closed)="onClosed()" />
    }
</ng-container>
