<ng-container rtContainerRightSidenavPanel #panel="rtContainerRightPanel" (cancelled)="onCancel()" (closed)="onClosed()" />

<rt-aside [ariaLabel]="t().uiColumnSettings">
    <rt-aside-header [title]="t().uiColumnSettingsTitle" (dismiss)="onClose()">
        <rt-icon-button
            asideActions
            qa-dataid="table-settings-reset"
            icon="undo"
            variant="ghost"
            [tooltip]="t().uiResetDefaults"
            [ariaLabel]="t().uiResetDefaults"
            (clicked)="onReset()" />
    </rt-aside-header>

    <rt-table-settings-panel [(items)]="items" />

    <rt-aside-footer>
        <button
            rtButton
            asideDismiss
            qa-dataid="table-settings-close"
            type="button"
            appearance="text"
            [label]="t().uiClose"
            [attr.aria-label]="t().uiClose"
            (click)="onClose()"></button>
        <button
            rtButton
            asidePrimary
            qa-dataid="table-settings-save"
            type="button"
            [label]="t().uiSave"
            [attr.aria-label]="t().uiSave"
            (click)="onSave()"></button>
    </rt-aside-footer>
</rt-aside>
