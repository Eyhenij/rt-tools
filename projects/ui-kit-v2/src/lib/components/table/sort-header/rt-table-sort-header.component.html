<ng-container rtBlock="rt-table-sort-header">
    @if (sortable()) {
        <button
            rtElem="button"
            qa-dataid="table-sort-header"
            type="button"
            [attr.data-column]="rtSortHeader()"
            [attr.data-direction]="direction()"
            [rtMod]="{ active: direction() !== null }"
            (click)="onToggle()">
            <ng-container [rtSlotOutlet]="contents()" />
            <rt-icon rtElem="icon" size="xs" [name]="icon()" />
        </button>
    } @else {
        <ng-container [rtSlotOutlet]="contents()" />
    }
</ng-container>
