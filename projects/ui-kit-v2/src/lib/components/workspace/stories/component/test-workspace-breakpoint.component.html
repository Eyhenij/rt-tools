<div style="block-size: 100dvh; overflow: hidden; background: var(--rt-color-bg-surface)">
    <rt-workspace
        hasActive
        style="block-size: 100%"
        [singleColumnBreakpoint]="breakpoint"
        [asideOverlayWidth]="overlayWidth"
        [asideTitle]="title"
        [asideContentLayout]="layout">
        <ng-template rtWorkspaceList>
            <div style="padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem">
                <strong>Переписки</strong>
                @for (row of rows; track row) {
                    <span>{{ row }}</span>
                }
            </div>
        </ng-template>
        <ng-template rtWorkspaceCenter>
            <div style="padding-block: 1rem; display: flex; flex-direction: column; gap: 0.5rem">
                <strong>Анна Смирнова</strong>
                <span>Добрый день! Можно заехать на час раньше?</span>
            </div>
        </ng-template>
        <ng-template rtWorkspaceAside>
            <rt-tabs qa-dataid="breakpoint-details">
                @for (tab of tabs; track tab; let first = $first) {
                    <ng-template [rtTab]="tab" [label]="tab">
                        @if (first) {
                            <rt-detail-list>
                                <rt-detail-row label="Гость">Анна Смирнова</rt-detail-row>
                                <rt-detail-row label="Телефон">+7 900 123-45-67</rt-detail-row>
                                <rt-detail-row label="Статус"><rt-tag value="Подтверждено" severity="success" /></rt-detail-row>
                            </rt-detail-list>
                            <rt-aside-section heading="Контакты">
                                <rt-field label="Телефон"><rt-input [formControl]="phone" /></rt-field>
                                <rt-field label="Почта"><rt-input [formControl]="mail" /></rt-field>
                            </rt-aside-section>
                        }
                    </ng-template>
                }
            </rt-tabs>
        </ng-template>
    </rt-workspace>
</div>
