<ng-container rtBlock="rt-detail-row">
    <span rtElem="label" qa-dataid="detail-row-label">{{ label() }}</span>
    <div rtElem="value" qa-dataid="detail-row-value">
        <!-- Значение стоит в странице и в загрузке: заглушка встаёт на его место, а само оно прячется. -->
        <span rtElem="value-box">
            @if (loading()) {
                <rt-skeleton qa-dataid="skeleton-wrapper-placeholder" width="180px" height="16px" />
            }
            <span rtElem="value-body" [rtMod]="{ hidden: loading() }"><ng-content /></span>
        </span>
    </div>
</ng-container>
