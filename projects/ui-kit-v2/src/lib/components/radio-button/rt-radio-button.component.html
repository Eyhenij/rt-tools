<div
    rtBlock="rt-radio-button"
    qa-dataid="radio-button-control"
    role="radio"
    tabindex="0"
    [rtMod]="{ checked: isChecked(), disabled: isDisabled(), card: card() }"
    [attr.aria-checked]="isChecked()"
    [attr.aria-disabled]="isDisabled()"
    [attr.aria-label]="ariaLabel()"
    (click)="onClick($event)"
    (keydown)="onKeydown($event)">
    <span rtElem="indicator">
        @if (isChecked()) {
            <span rtElem="dot"></span>
        }
    </span>

    @if (label() || description()) {
        <span rtElem="content">
            @if (label()) {
                <span rtElem="label" qa-dataid="radio-button-label">{{ label() }}</span>
            }
            @if (description()) {
                <span rtElem="description" qa-dataid="radio-button-description">{{ description() }}</span>
            }
        </span>
    }
</div>
