<div class="app-side-menu-cell">
    <rt-side-menu [menuItems]="items()" [activeMenuIds]="activeIds()" [subMenuMode]="mode()" [subMenuWidth]="width()">
        @if (slots()) {
            <ng-template rtSideMenuHeader>
                <div class="app-side-menu-cell__slot">Лого</div>
            </ng-template>
            <ng-template rtSideMenuFooter>
                <div class="app-side-menu-cell__slot">Профиль</div>
            </ng-template>
        }
    </rt-side-menu>
</div>
