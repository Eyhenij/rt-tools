@switch (part) {
    @case ('types') {
        <app-story-presets caption="Три типа в обоих наборах">
            <ng-template>
                <app-story-row [items]="typeCases" [itemLabel]="caseLabel">
                    <ng-template let-typeCase>
                        <div [style]="surface">
                            <rt-date-panel
                                [type]="typeCase.type"
                                [value]="typeCase.value"
                                [min]="typeCase.min"
                                [max]="typeCase.max"
                                [now]="now" />
                        </div>
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('bounds') {
        <app-story-presets caption="Границы min и max в обоих наборах">
            <ng-template>
                <app-story-row [items]="boundCases" [itemLabel]="caseLabel">
                    <ng-template let-boundCase>
                        <div [style]="surface">
                            <rt-date-panel
                                [type]="boundCase.type"
                                [value]="boundCase.value"
                                [min]="boundCase.min"
                                [max]="boundCase.max"
                                [now]="now" />
                        </div>
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('months') {
        <app-story-presets caption="Выбор месяца и года в обоих наборах">
            <ng-template>
                <app-story-row [items]="monthCases" [itemLabel]="caseLabel">
                    <ng-template let-monthCase>
                        <div [style]="surface">
                            <rt-date-panel
                                [type]="monthCase.type"
                                [value]="monthCase.value"
                                [min]="monthCase.min"
                                [max]="monthCase.max"
                                [now]="now" />
                        </div>
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('sheet') {
        <!--
            Раскладка нижней шторки: панель на ширине телефона. Шторку саму по себе показывает
            её история; здесь — что в неё кладёт поле: дни под палец и переключатель
            «Дата | Время» у даты со временем.
        -->
        <app-story-presets caption="Раскладка шторки в обоих наборах">
            <ng-template>
                <app-story-row [items]="sheetCases" [itemLabel]="caseLabel">
                    <ng-template let-sheetCase>
                        <div [style]="sheetBox">
                            <rt-date-panel sheet [type]="sheetCase.type" [value]="sheetCase.value" [now]="now" />
                        </div>
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('themes') {
        <app-story-presets caption="Панель в обеих темах в обоих наборах">
            <ng-template>
                <app-story-themes>
                    <ng-template>
                        @for (themeCase of themeCases; track themeCase.name) {
                            <div [style]="surface">
                                <rt-date-panel [type]="themeCase.type" [value]="themeCase.value" [now]="now" />
                            </div>
                        }
                    </ng-template>
                </app-story-themes>
            </ng-template>
        </app-story-presets>
    }
}
