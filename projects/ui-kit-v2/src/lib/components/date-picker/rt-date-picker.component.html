<ng-container rtBlock="rt-date-picker">
    @if (isReadonly()) {
        <span rtElem="readonly" qa-dataid="date-picker-readonly" [rtMod]="{ empty: !displayText() }">{{ displayText() || '—' }}</span>
    } @else {
        <input
            #fieldEl
            rtElem="field"
            qa-dataid="date-picker-control"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            [value]="text()"
            [disabled]="isDisabled()"
            [attr.placeholder]="shape()"
            [attr.title]="shapeTitle()"
            [attr.size]="fieldSize()"
            [attr.id]="effectiveControlId()"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-invalid]="isInvalid() || textInvalid() || null"
            (input)="onTyped($event)"
            (blur)="onBlur()" />
        @if (showClearButton()) {
            <rt-icon-button
                rtElem="clear"
                qa-dataid="date-picker-clear"
                icon="ico-close"
                size="sm"
                variant="ghost"
                iconColor="muted"
                [ariaLabel]="t().uiClear"
                [tabIndex]="clearTabIndex()"
                (clicked)="clear($event)" />
        }
        <rt-icon-button
            rtElem="open"
            qa-dataid="date-picker-open"
            size="sm"
            variant="ghost"
            iconColor="muted"
            rtPopoverAlign="end"
            [rtPopoverOrigin]="host"
            [icon]="openIcon()"
            [ariaLabel]="t().uiOpenCalendar"
            [disabled]="isDisabled()"
            [rtPopover]="panelTpl"
            [rtPopoverDisabled]="useSheet() || isDisabled()"
            (clicked)="openPanel()" />

        <ng-template #panelTpl>
            <div rtElem="popup" qa-dataid="date-picker-popup">
                <rt-date-panel
                    [type]="type()"
                    [value]="value()"
                    [min]="min()"
                    [max]="max()"
                    [minuteStep]="minuteStep()"
                    (picked)="onPicked($event)"
                    (closed)="closePanel()" />
            </div>
        </ng-template>

        @if (useSheet()) {
            <rt-bottom-sheet
                qa-dataid="date-picker-sheet"
                [open]="sheetOpen()"
                [ariaLabel]="sheetTitle() || null"
                [unsaved]="sheetPanel()?.dirty() ?? false"
                (applyRequest)="sheetPanel()?.apply()"
                (openChange)="sheetOpen.set($event)">
                <!-- Заголовок шторки — подпись поля или его доступное имя; без них в шапке остаётся кнопка закрытия. -->
                @if (sheetTitle()) {
                    <span sheetHeader rtElem="sheet-title" qa-dataid="date-picker-sheet-title">{{ sheetTitle() }}</span>
                }
                <!--
                    Время и дата со временем уходят значением по кнопке: она стоит справа в шапке шторки,
                    и набранное без неё шторка перед закрытием спрашивает. Дата без времени выбирается
                    касанием дня, кнопки у неё нет.
                -->
                @if (type() !== 'date') {
                    <button
                        sheetAction
                        rtButton
                        type="button"
                        size="sm"
                        appearance="filled"
                        qa-dataid="date-picker-sheet-apply"
                        [label]="type() === 'time' ? t().uiDone : t().uiApply"
                        [attr.aria-label]="type() === 'time' ? t().uiDone : t().uiApply"
                        [disabled]="!(sheetPanel()?.canApply() ?? false)"
                        (click)="sheetPanel()?.apply()"></button>
                }
                @if (sheetOpen()) {
                    <rt-date-panel
                        #sheetPanel
                        sheet
                        applyOutside
                        [type]="type()"
                        [value]="value()"
                        [min]="min()"
                        [max]="max()"
                        [minuteStep]="minuteStep()"
                        [timeStart]="timeStart()"
                        (picked)="onPicked($event)"
                        (closed)="closePanel()" />
                }
            </rt-bottom-sheet>
        }
    }
</ng-container>
