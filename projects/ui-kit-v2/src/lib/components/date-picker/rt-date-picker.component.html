<ng-container rtBlock="rt-date-picker">
    @if (isReadonly()) {
        <span rtElem="readonly" qa-dataid="date-picker-readonly" [rtMod]="{ empty: !displayText() }">{{ displayText() || '—' }}</span>
    } @else {
        <input
            #fieldEl
            rtElem="field"
            qa-dataid="date-picker-control"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            [value]="text()"
            [disabled]="isDisabled()"
            [attr.placeholder]="shape()"
            [attr.title]="shapeTitle()"
            [attr.size]="fieldSize()"
            [attr.id]="effectiveControlId()"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-invalid]="isInvalid() || textInvalid() || null"
            (input)="onTyped($event)"
            (blur)="onBlur()" />
        @if (showClearButton()) {
            <rt-icon-button
                rtElem="clear"
                qa-dataid="date-picker-clear"
                icon="ico-close"
                size="sm"
                variant="ghost"
                iconColor="muted"
                [ariaLabel]="t().uiClear"
                [tabIndex]="-1"
                (clicked)="clear($event)" />
        }
        <rt-icon-button
            rtElem="open"
            qa-dataid="date-picker-open"
            size="sm"
            variant="ghost"
            iconColor="muted"
            rtPopoverAlign="end"
            [icon]="openIcon()"
            [ariaLabel]="t().uiOpenCalendar"
            [disabled]="isDisabled()"
            [rtPopover]="panelTpl"
            [rtPopoverDisabled]="narrow() || isDisabled()"
            (clicked)="openPanel()" />

        <ng-template #panelTpl>
            <div rtElem="popup" qa-dataid="date-picker-popup">
                <rt-date-panel
                    [type]="type()"
                    [value]="value()"
                    [min]="min()"
                    [max]="max()"
                    [minuteStep]="minuteStep()"
                    (picked)="onPicked($event)"
                    (closed)="closePanel()" />
            </div>
        </ng-template>

        @if (narrow()) {
            <rt-bottom-sheet qa-dataid="date-picker-sheet" [open]="sheetOpen()" (openChange)="sheetOpen.set($event)">
                @if (sheetOpen()) {
                    <rt-date-panel
                        sheet
                        [type]="type()"
                        [value]="value()"
                        [min]="min()"
                        [max]="max()"
                        [minuteStep]="minuteStep()"
                        (picked)="onPicked($event)"
                        (closed)="closePanel()" />
                }
            </rt-bottom-sheet>
        }
    }
</ng-container>
