<rt-dialog width="440px" qa-dataid="aside-unsaved-dialog" [ariaLabel]="t().uiUnsavedTitle">
    <div rtBlock="rt-aside-unsaved-dialog">
        <div rtElem="text">
            <h2 rtElem="title" qa-dataid="aside-unsaved-title">{{ t().uiUnsavedTitle }}</h2>
            <p rtElem="message" qa-dataid="aside-unsaved-message">{{ t().uiUnsavedMessage }}</p>
        </div>

        <div rtElem="footer">
            <button
                rtButton
                rtElem="discard"
                qa-dataid="aside-unsaved-discard"
                type="button"
                theme="danger"
                appearance="outlined"
                [label]="t().uiUnsavedDiscard"
                [attr.aria-label]="t().uiUnsavedDiscard"
                (click)="onDiscard()"></button>
            <button
                rtButton
                rtElem="stay"
                qa-dataid="aside-unsaved-stay"
                type="button"
                theme="secondary"
                appearance="text"
                [label]="t().uiUnsavedStay"
                [attr.aria-label]="t().uiUnsavedStay"
                (click)="onStay()"></button>
            <button
                rtButton
                rtElem="save"
                qa-dataid="aside-unsaved-save"
                type="button"
                appearance="filled"
                [label]="t().uiUnsavedSave"
                [attr.aria-label]="t().uiUnsavedSave"
                (click)="onSave()"></button>
        </div>
    </div>
</rt-dialog>
