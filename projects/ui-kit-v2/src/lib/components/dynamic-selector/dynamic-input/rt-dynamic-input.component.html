<ng-container rtBlock="rt-dynamic-input">
    <rt-dynamic-selector-list
        [rows]="rows()"
        [draggable]="draggable()"
        [buttonRadius]="buttonRadius()"
        [clearIcon]="clearIcon()"
        [editable]="editable()"
        [disabled]="isDisabled()"
        [actionsShown]="!isInvitationShown()"
        [resetClearShown]="listActionsShown()"
        [removeShown]="removeShown()"
        [resetDisabled]="isResetDisabled()"
        [clearDisabled]="isClearDisabled()"
        [controlsTpl]="controlsTpl()"
        (removed)="onRemoved($event)"
        (moved)="onMoved($event)"
        (edited)="onEdited($event)"
        (resetClicked)="onReset()"
        (cleared)="onCleared()">
        @if (isAddShown()) {
            <button
                rtButton
                appearance="text"
                type="button"
                qa-dataid="dynamic-input-add"
                [label]="addTitle()"
                [attr.aria-label]="addTitle()"
                [disabled]="isDisabled()"
                (click)="onAdd()"></button>
        }
    </rt-dynamic-selector-list>

    @if (isFieldShown()) {
        <!-- Подпись поля рисует rt-field: у rt-input своей нет. Обёртка стоит только при подписи —
             пустая добавила бы зазор под полем и сдвинула прежний вид. -->
        @if (fieldLabel(); as label) {
            <rt-field qa-dataid="dynamic-input-field-label" [label]="label">
                <rt-input
                    #field
                    rtElem="field"
                    qa-dataid="dynamic-input-field"
                    [appearance]="fieldAppearance()"
                    [controlId]="effectiveControlId()"
                    [placeholder]="fieldPlaceholder()"
                    [ngModel]="draft()"
                    (ngModelChange)="draft.set($event ?? '')"
                    (keydown.enter)="onCommit()"
                    (focusout)="onCommit()" />
            </rt-field>
        } @else {
            <rt-input
                #field
                rtElem="field"
                qa-dataid="dynamic-input-field"
                [appearance]="fieldAppearance()"
                [controlId]="effectiveControlId()"
                [placeholder]="fieldPlaceholder()"
                [ngModel]="draft()"
                (ngModelChange)="draft.set($event ?? '')"
                (keydown.enter)="onCommit()"
                (focusout)="onCommit()" />
        }
    }

    @if (isInvitationShown()) {
        <rt-empty-state
            rtElem="invitation"
            qa-dataid="dynamic-input-invitation"
            [icon]="invitationIcon()"
            [glyph]="invitationGlyph()"
            [description]="invitationDescription()">
            <button
                rtButton
                type="button"
                qa-dataid="dynamic-input-invitation-add"
                [appearance]="invitationButtonAppearance()"
                [icon]="invitationButtonIcon()"
                [label]="addTitle()"
                [attr.aria-label]="addTitle()"
                [disabled]="isDisabled()"
                (click)="onAdd()"></button>
        </rt-empty-state>
    }
</ng-container>
