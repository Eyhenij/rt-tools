<ng-container rtBlock="rt-dynamic-selector">
    @if (isNothingToChoose()) {
        <rt-empty-state rtElem="nothing" qa-dataid="dynamic-selector-nothing" icon="warning" [title]="nothingToChooseLabel()" />
    } @else {
        <div rtElem="content">
            <!-- Под приглашением пустой список не рисуется: узел нулевой высоты сдвигал бы приглашение зазором. -->
            @if (rows().length > 0 || !invitation()) {
                <rt-dynamic-selector-list [addButton]="addButtonTpl" />
                <!-- Кнопку добавления рисует список: она создаётся, только пока его полоса действий показана. -->
                <ng-template #addButtonTpl>
                    @if (isAddShown()) {
                        <button
                            rtButton
                            theme="secondary"
                            appearance="text"
                            type="button"
                            qa-dataid="dynamic-selector-add"
                            rtPopoverTrigger="manual"
                            #addPopover="rtPopover"
                            [rtPopover]="popupTpl"
                            [rtPopoverSheet]="sheet()"
                            [rtPopoverSheetAction]="sheetApplyTpl"
                            [rtPopoverSheetUnsaved]="sheetUnsaved()"
                            [rtPopoverSheetTitle]="addTitle()"
                            [rtPopoverDisabled]="isDisabled()"
                            [label]="addTitle()"
                            [attr.aria-label]="addTitle()"
                            [disabled]="isDisabled()"
                            (rtPopoverOpened)="onOpened()"
                            (rtPopoverSheetApply)="onSheetApply()"
                            (rtPopoverClosed)="onClosed()"
                            (click)="onAdd(addPopover)"></button>
                    }
                </ng-template>
            }

            @if (invitation()) {
                <rt-empty-state
                    rtElem="invitation"
                    qa-dataid="dynamic-selector-invitation"
                    [icon]="invitationIcon()"
                    [glyph]="invitationGlyph()"
                    [description]="invitationDescription()">
                    @if (hasOffer()) {
                        <button
                            rtButton
                            type="button"
                            qa-dataid="dynamic-selector-invitation-add"
                            rtPopoverTrigger="manual"
                            #invitationPopover="rtPopover"
                            [appearance]="invitationButtonAppearance()"
                            [icon]="invitationButtonIcon()"
                            [rtPopover]="popupTpl"
                            [rtPopoverSheet]="sheet()"
                            [rtPopoverSheetAction]="sheetApplyTpl"
                            [rtPopoverSheetUnsaved]="sheetUnsaved()"
                            [rtPopoverSheetTitle]="addTitle()"
                            [rtPopoverDisabled]="isDisabled()"
                            [label]="addTitle()"
                            [attr.aria-label]="addTitle()"
                            [disabled]="isDisabled()"
                            (rtPopoverOpened)="onOpened()"
                            (rtPopoverSheetApply)="onSheetApply()"
                            (rtPopoverClosed)="onClosed()"
                            (click)="onAdd(invitationPopover)"></button>
                    }
                </rt-empty-state>
            }
        </div>
    }

    <ng-template #popupTpl>
        <rt-dynamic-selector-popup />
    </ng-template>

    <!-- «Применить» в шапке шторки: окно выбора в шторке своих кнопок не рисует. -->
    <ng-template #sheetApplyTpl>
        <button
            rtButton
            type="button"
            size="sm"
            appearance="filled"
            qa-dataid="dynamic-selector-sheet-apply"
            [label]="applyText()"
            [attr.aria-label]="applyText()"
            [disabled]="!sheetUnsaved() || loading()"
            (click)="onSheetApply()"></button>
    </ng-template>
</ng-container>
