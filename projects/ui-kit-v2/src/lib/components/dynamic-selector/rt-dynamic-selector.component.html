<ng-container rtBlock="rt-dynamic-selector">
    @if (isNothingToChoose()) {
        <rt-empty-state rtElem="nothing" qa-dataid="dynamic-selector-nothing" icon="warning" [title]="nothingToChooseLabel()" />
    } @else {
        <div rtElem="content">
            <rt-dynamic-selector-list
                [rows]="rows()"
                [draggable]="draggable()"
                [buttonRadius]="buttonRadius()"
                [clearIcon]="clearIcon()"
                [titleWrap]="titleWrap()"
                [disabled]="isDisabled()"
                [actionsShown]="!invitation()"
                [resetClearShown]="listActionsShown()"
                [removeShown]="removeShown()"
                [resetDisabled]="isResetDisabled()"
                [clearDisabled]="isClearDisabled()"
                [titleTpl]="titleTpl()"
                [controlsTpl]="controlsTpl()"
                (removed)="onRemoved($event)"
                (moved)="onMoved($event)"
                (resetClicked)="onReset()"
                (cleared)="onCleared()">
                @if (isAddShown()) {
                    <button
                        rtButton
                        theme="secondary"
                        appearance="text"
                        type="button"
                        qa-dataid="dynamic-selector-add"
                        rtPopoverTrigger="manual"
                        #addPopover="rtPopover"
                        [rtPopover]="popupTpl"
                        [rtPopoverDisabled]="isDisabled()"
                        [label]="addTitle()"
                        [attr.aria-label]="addTitle()"
                        [disabled]="isDisabled()"
                        (rtPopoverOpened)="onOpened()"
                        (rtPopoverClosed)="onClosed()"
                        (click)="onAdd(addPopover)"></button>
                }
            </rt-dynamic-selector-list>

            @if (invitation()) {
                <rt-empty-state
                    rtElem="invitation"
                    qa-dataid="dynamic-selector-invitation"
                    [icon]="invitationIcon()"
                    [glyph]="invitationGlyph()"
                    [description]="invitationDescription()">
                    @if (hasOffer()) {
                        <button
                            rtButton
                            type="button"
                            qa-dataid="dynamic-selector-invitation-add"
                            rtPopoverTrigger="manual"
                            #invitationPopover="rtPopover"
                            [appearance]="invitationButtonAppearance()"
                            [icon]="invitationButtonIcon()"
                            [rtPopover]="popupTpl"
                            [rtPopoverDisabled]="isDisabled()"
                            [label]="addTitle()"
                            [attr.aria-label]="addTitle()"
                            [disabled]="isDisabled()"
                            (rtPopoverOpened)="onOpened()"
                            (rtPopoverClosed)="onClosed()"
                            (click)="onAdd(invitationPopover)"></button>
                    }
                </rt-empty-state>
            }
        </div>
    }

    <ng-template #popupTpl>
        <rt-dynamic-selector-popup
            [entities]="offered()"
            [keyExp]="keyExp()"
            [displayExp]="displayExp()"
            [mode]="mode()"
            [multiToggleShown]="multiToggleShown()"
            [selectAllShown]="selectAllShown()"
            [localSearch]="localSearch()"
            [lazyLoad]="lazyLoad()"
            [loading]="loading()"
            [fetching]="fetching()"
            [pinnedKeys]="pinnedKeys()"
            [navigateTitle]="navigateTitle()"
            [navigateLink]="navigateLink()"
            [searchTerm]="searchTerm()"
            [searchAppearance]="searchAppearance()"
            [searchRadius]="searchRadius()"
            [emptyResultsText]="emptyResultsText()"
            [titleWrap]="titleWrap()"
            [highlightSearch]="highlightSearch()"
            [applyLabel]="applyLabel()"
            [applyLabelCase]="applyLabelCase()"
            [autofocusSearch]="autofocusSearch()"
            (applied)="onApplied($event)"
            (cancelled)="onCancelled()"
            (searchChange)="searchChange.emit($event)"
            (loadMore)="loadMore.emit()"
            (temporaryChoiceChange)="temporaryChoiceChange.emit($event)" />
    </ng-template>
</ng-container>
