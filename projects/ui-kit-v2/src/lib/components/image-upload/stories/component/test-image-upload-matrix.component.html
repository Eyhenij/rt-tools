@switch (part) {
    @case ('states') {
        <app-story-presets caption="Состояния загрузчика в обоих наборах">
            <ng-template>
                <app-story-row [items]="stateCases()" [itemLabel]="caseLabel" [slotWidth]="cellWidth">
                    <ng-template let-stateCase>
                        <rt-image-upload
                            [imageUrl]="stateCase.imageUrl"
                            [downloadable]="stateCase.downloadable"
                            [downloadShape]="stateCase.downloadShape"
                            [loading]="stateCase.loading"
                            [disabled]="stateCase.disabled" />
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('presets') {
        <app-story-presets caption="Загрузчик в обоих наборах">
            <ng-template>
                <app-story-row [items]="presetCases()" [itemLabel]="caseLabel" [slotWidth]="cellWidth">
                    <ng-template let-presetCase>
                        <rt-image-upload downloadable [imageUrl]="presetCase.imageUrl" />
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('options') {
        <app-story-presets caption="Настройки кнопок загрузчика в обоих наборах">
            <ng-template>
                <app-story-row [items]="optionCases()" [itemLabel]="caseLabel" [slotWidth]="cellWidth">
                    <ng-template let-optionCase>
                        <rt-image-upload
                            downloadable
                            [style]="optionCase.style"
                            [imageUrl]="optionCase.imageUrl"
                            [chooseAppearance]="optionCase.chooseAppearance"
                            [chooseIcon]="optionCase.chooseIcon"
                            [downloadIconSize]="optionCase.downloadIconSize" />
                    </ng-template>
                </app-story-row>
            </ng-template>
        </app-story-presets>
    }

    @case ('buttons') {
        <app-story-presets caption="Кнопка удаления в обоих наборах">
            <ng-template>
                @for (row of buttonRows; track row.caption) {
                    <app-story-row [caption]="row.caption" [items]="row.cases" [itemLabel]="caseLabel" [slotWidth]="cellWidth">
                        <ng-template let-buttonsCase>
                            <div [attr.data-story-state]="buttonsCase.state">
                                <div [attr.data-story-state]="buttonsCase.innerState">
                                    <rt-image-upload
                                        removable
                                        [imageUrl]="sampleUrl()"
                                        [downloadable]="buttonsCase.downloadable"
                                        [downloadShape]="buttonsCase.shape"
                                        [buttonsCorner]="buttonsCase.corner"
                                        [buttonsPlacement]="buttonsCase.placement"
                                        [buttonsVisibility]="buttonsCase.visibility"
                                        [disabled]="buttonsCase.disabled" />
                                </div>
                            </div>
                        </ng-template>
                    </app-story-row>
                }
            </ng-template>
        </app-story-presets>
    }

    @case ('place') {
        <app-story-presets caption="Место кнопок: угол и вид, в обоих наборах">
            <ng-template>
                @for (row of placeRows; track row.caption) {
                    <app-story-row [caption]="row.caption" [items]="row.cases" [itemLabel]="caseLabel" [slotWidth]="cellWidth">
                        <ng-template let-placeCase>
                            <div [attr.data-story-state]="placeCase.state">
                                <rt-image-upload
                                    removable
                                    [imageUrl]="sampleUrl()"
                                    [downloadable]="placeCase.downloadable"
                                    [downloadShape]="placeCase.shape"
                                    [buttonsCorner]="placeCase.corner"
                                    [buttonsPlacement]="placeCase.placement" />
                            </div>
                        </ng-template>
                    </app-story-row>
                }
            </ng-template>
        </app-story-presets>
    }

    @case ('themes') {
        <app-story-presets caption="Загрузчик в обеих темах в обоих наборах">
            <ng-template>
                <app-story-themes>
                    <ng-template>
                        <app-story-row [items]="presetCases()" [itemLabel]="caseLabel" [slotWidth]="cellWidth">
                            <ng-template let-themeCase>
                                <rt-image-upload downloadable [imageUrl]="themeCase.imageUrl" />
                            </ng-template>
                        </app-story-row>
                    </ng-template>
                </app-story-themes>
            </ng-template>
        </app-story-presets>
    }
}
