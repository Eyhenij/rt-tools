<ng-container rtBlock="rt-menu-item">
    @if (isLink()) {
        <a
            rtElem="link"
            role="menuitem"
            qa-dataid="menu-item-link"
            [routerLink]="linkTarget()"
            [attr.aria-current]="current() ? 'true' : null"
            [attr.aria-disabled]="disabled() ? 'true' : null"
            [attr.tabindex]="disabled() ? null : 0">
            <ng-container [ngTemplateOutlet]="content" />
        </a>
    } @else {
        <ng-container [ngTemplateOutlet]="content" />
    }

    <ng-template #content>
        @if (ownIcon(); as own) {
            <span rtElem="icon" qa-dataid="menu-item-own-icon" aria-hidden="true" [rtMod]="{ own: true }">
                <ng-container [ngTemplateOutlet]="own.templateRef" />
            </span>
        } @else if (iconName(); as name) {
            <rt-icon rtElem="icon" size="sm" [name]="name" [fill]="fill()" />
        }

        <span rtElem="label" qa-dataid="menu-item-label">{{ label() }}</span>
    </ng-template>
</ng-container>
