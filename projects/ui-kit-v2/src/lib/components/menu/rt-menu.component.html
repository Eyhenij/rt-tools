<rt-icon-button
    cdkOverlayOrigin
    qa-dataid="menu-trigger"
    #trigger="cdkOverlayOrigin"
    variant="ghost"
    [size]="triggerSize()"
    [icon]="icon()"
    [ariaLabel]="ariaText()"
    [tooltip]="ariaText()"
    [disabled]="disabled()"
    (clicked)="toggle($event)" />

<ng-template
    cdkConnectedOverlay
    cdkConnectedOverlayHasBackdrop
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="(isOpen() || confirming() > 0) && !openedInSheet()"
    [cdkConnectedOverlayPositions]="overlayPositions()"
    [cdkConnectedOverlayPanelClass]="panelClasses()"
    (backdropClick)="onBackdropClick()"
    (attach)="onAttach()"
    (detach)="close()"
    (overlayKeydown)="onKeydown($event)">
    <ng-container [ngTemplateOutlet]="panelTpl" />
</ng-template>

<!-- Панель одна: у кнопки на широком экране, в нижней шторке на телефоне. -->
<ng-template #panelTpl>
    <ng-container rtBlock="rt-menu">
        <!-- Закрытое меню, чей пункт ждёт подтверждения, держит панель скрытой до ответа. -->
        <div
            rtElem="panel"
            qa-dataid="menu-panel"
            role="menu"
            tabindex="-1"
            [rtMod]="{ size: size(), held: !isOpen() }"
            (rtMenuSelect)="onSelect()"
            (rtMenuConfirm)="onConfirm($event)"
            (keydown)="onSheetKeydown($event)">
            <ng-container [rtSlotOutlet]="contents()" />
        </div>
    </ng-container>
</ng-template>
