@if (part === 'presets') {
    <app-story-presets caption="Поле ввода в обоих наборах">
        <ng-template>
            <div style="inline-size: 480px; max-inline-size: 100%">
                <rt-ai-prompt-input
                    [model]="model"
                    [effort]="effort"
                    [mode]="mode"
                    [usage]="usage"
                    [usageHint]="usageHint"
                    [attachments]="attachments"
                    [hintPosition]="hintPosition"
                    [sending]="sending"
                    [stoppable]="stoppable"
                    [disabled]="disabled"
                    [(text)]="text" />
            </div>
        </ng-template>
    </app-story-presets>
} @else {
    <div style="inline-size: 480px; max-inline-size: 100%">
        <rt-ai-prompt-input
            [model]="model"
            [effort]="effort"
            [mode]="mode"
            [usage]="usage"
            [usageHint]="usageHint"
            [attachments]="attachments"
            [hintPosition]="hintPosition"
            [sending]="sending"
            [stoppable]="stoppable"
            [disabled]="disabled"
            [(text)]="text" />
    </div>
}
