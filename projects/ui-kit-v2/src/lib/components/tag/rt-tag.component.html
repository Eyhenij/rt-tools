<span
    rtBlock="rt-tag"
    qa-dataid="tag"
    [attr.data-severity]="severity()"
    [rtMod]="{
        severity: severity(),
        size: size(),
        shape: shape(),
        appearance: appearance(),
        radius: radius(),
        closable: closable(),
    }">
    @if (icon(); as iconName) {
        <rt-icon rtElem="icon" [size]="iconSize()" [name]="iconName" />
    }
    <span rtElem="text" qa-dataid="tag-text">{{ value() }}</span>
    @if (iconEnd(); as iconEndName) {
        <rt-icon rtElem="icon-end" [size]="iconSize()" [name]="iconEndName" />
    }
    @if (closable()) {
        <rt-icon-button
            rtElem="close"
            qa-dataid="tag-close"
            icon="ico-close"
            variant="ghost"
            size="sm"
            shape="circle"
            [ariaLabel]="t().uiRemove"
            (clicked)="onClose($event)" />
    }
</span>
