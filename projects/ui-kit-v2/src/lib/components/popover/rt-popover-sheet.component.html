<ng-container rtBlock="rt-popover-sheet">
    <rt-bottom-sheet qa-dataid="popover-sheet" [open]="open()" (openChange)="openChange($event)">
        @if (title()) {
            <span sheetHeader rtElem="title" qa-dataid="popover-sheet-title">{{ title() }}</span>
        }
        <div rtElem="panel" qa-dataid="popover-sheet-panel">
            <ng-container [ngTemplateOutlet]="template()" [ngTemplateOutletContext]="{ $implicit: context() }" />
        </div>
    </rt-bottom-sheet>
</ng-container>
