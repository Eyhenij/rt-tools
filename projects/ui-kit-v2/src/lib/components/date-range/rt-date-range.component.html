<ng-container rtBlock="rt-date-range">
    @if (isReadonly()) {
        <span rtElem="readonly" qa-dataid="date-range-readonly" [rtMod]="{ empty: !displayText() }">{{ displayText() || '—' }}</span>
    } @else {
        <input
            #fieldEl
            rtElem="field"
            qa-dataid="date-range-control"
            type="text"
            autocomplete="off"
            spellcheck="false"
            [value]="text()"
            [disabled]="isDisabled()"
            [attr.placeholder]="shape()"
            [attr.title]="shapeTitle()"
            [attr.size]="fieldSize()"
            [attr.id]="effectiveControlId()"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-invalid]="isInvalid() || textInvalid() || null"
            (input)="onTyped($event)"
            (blur)="onBlur()" />
        @if (showClearButton()) {
            <rt-icon-button
                rtElem="clear"
                qa-dataid="date-range-clear"
                icon="ico-close"
                size="sm"
                variant="ghost"
                iconColor="muted"
                [ariaLabel]="t().uiClear"
                [tabIndex]="clearTabIndex()"
                (clicked)="clear($event)" />
        }
        <rt-icon-button
            rtElem="open"
            qa-dataid="date-range-open"
            icon="calendar-2"
            size="sm"
            variant="ghost"
            iconColor="muted"
            rtPopoverAlign="end"
            [rtPopoverOrigin]="host"
            [ariaLabel]="t().uiOpenCalendar"
            [disabled]="isDisabled()"
            [rtPopover]="panelTpl"
            [rtPopoverDisabled]="useSheet() || isDisabled()"
            (clicked)="openPanel()" />

        <ng-template #panelTpl>
            <div rtElem="popup" qa-dataid="date-range-popup">
                <rt-date-range-panel [value]="range()" [min]="min()" [max]="max()" (picked)="onPicked($event)" (closed)="closePanel()" />
            </div>
        </ng-template>

        @if (useSheet()) {
            <rt-bottom-sheet
                qa-dataid="date-range-sheet"
                [open]="sheetOpen()"
                [ariaLabel]="sheetTitle() || null"
                [unsaved]="sheetPanel()?.dirty() ?? false"
                (applyRequest)="sheetPanel()?.apply()"
                (openChange)="sheetOpen.set($event)">
                <!-- Заголовок шторки — подпись поля или его доступное имя; без них в шапке остаётся кнопка закрытия. -->
                @if (sheetTitle()) {
                    <span sheetHeader rtElem="sheet-title" qa-dataid="date-range-sheet-title">{{ sheetTitle() }}</span>
                }
                <!-- «Применить» стоит справа в шапке шторки; выбранный и не применённый период шторка перед закрытием спрашивает. -->
                <button
                    sheetAction
                    rtButton
                    type="button"
                    size="sm"
                    appearance="filled"
                    qa-dataid="date-range-sheet-apply"
                    [label]="t().uiApply"
                    [attr.aria-label]="t().uiApply"
                    [disabled]="!(sheetPanel()?.canApply() ?? false)"
                    (click)="sheetPanel()?.apply()"></button>
                @if (sheetOpen()) {
                    <rt-date-range-panel
                        #sheetPanel
                        sheet
                        applyOutside
                        [value]="range()"
                        [min]="min()"
                        [max]="max()"
                        (picked)="onPicked($event)"
                        (closed)="closePanel()" />
                }
            </rt-bottom-sheet>
        }
    }
</ng-container>
