<ng-container rtBlock="rt-ai-chat-answer">
    @if (message().run; as run) {
        <rt-ai-run-status
            qa-dataid="ai-chat-run"
            [state]="run.state"
            [label]="run.label"
            [meta]="run.meta ?? ''"
            [steps]="run.steps ?? []"
            [(expanded)]="expanded" />
    }
    @if (message().blocks.length) {
        <rt-ai-chat-blocks
            rtElem="blocks"
            qa-dataid="ai-chat-answer-blocks"
            [blocks]="message().blocks"
            (linkOpen)="linkOpen.emit($event)"
            (sourceOpen)="sourceOpen.emit($event)" />
    }
    @if (extra(); as extraTemplate) {
        <ng-container [ngTemplateOutlet]="extraTemplate" [ngTemplateOutletContext]="{ $implicit: message() }" />
    }
    @if (isInterrupted()) {
        <p rtElem="interrupted" qa-dataid="ai-chat-interrupted" [id]="interruptedId">{{ t().aiInterrupted }}</p>
    }
    @if (isWritten() || isInterrupted()) {
        <div rtElem="feedback" qa-dataid="ai-chat-feedback">
            @if (isWritten() && canCopy()) {
                <rt-ai-chat-copy [text]="plainText()" />
            }
            @if (isInterrupted()) {
                <rt-icon-button
                    qa-dataid="ai-chat-ask-again"
                    size="sm"
                    iconSize="sm"
                    icon="sync"
                    [ariaLabel]="t().aiRetry"
                    [ariaDescribedby]="interruptedId"
                    [tooltip]="t().aiRetry"
                    [disabled]="sending()"
                    (clicked)="askAgain.emit()" />
            }
            @if (isWritten()) {
                <rt-icon-button
                    qa-dataid="ai-chat-like"
                    size="sm"
                    iconSize="sm"
                    icon="thumb-up"
                    [active]="message().feedback === 'liked'"
                    [ariaLabel]="t().aiLike"
                    [tooltip]="t().aiLike"
                    (clicked)="feedbackChange.emit('liked')" />
                <rt-icon-button
                    qa-dataid="ai-chat-dislike"
                    size="sm"
                    iconSize="sm"
                    icon="thumb-down"
                    [active]="message().feedback === 'disliked'"
                    [ariaLabel]="t().aiDislike"
                    [tooltip]="t().aiDislike"
                    (clicked)="feedbackChange.emit('disliked')" />
            }
        </div>
    }
</ng-container>
