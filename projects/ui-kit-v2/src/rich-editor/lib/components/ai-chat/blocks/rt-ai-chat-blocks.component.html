<ng-container rtBlock="rt-ai-chat-blocks">
    @for (view of views(); track $index) {
        @switch (view.kind) {
            @case ('markdown') {
                <rt-markdown-text rtElem="markdown" qa-dataid="ai-chat-block-markdown" [text]="view.text" />
            }
            @case ('notice') {
                <rt-message rtElem="notice" qa-dataid="ai-chat-block-notice" live="status" [severity]="view.severity">
                    {{ view.text }}
                </rt-message>
            }
            @case ('table') {
                <rt-ai-chat-table rtElem="table" qa-dataid="ai-chat-block-table" [data]="view.data" [title]="view.title" />
            }
            @case ('custom') {
                <ng-container *ngComponentOutlet="view.component; inputs: { block: view.block }" />
            }
            @case ('unsupported') {
                <div rtElem="unsupported" qa-dataid="ai-chat-block-unsupported" [attr.data-type]="view.type">
                    {{ 'aiBlockUnsupported' | rtKitLabel: translate() : { type: view.type } }}
                </div>
            }
        }
    }
</ng-container>
