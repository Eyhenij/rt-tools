<ng-container rtBlock="rtui-scrollable">
    @if (headerTpl()) {
        <div rtElem="header">
            <ng-container *ngTemplateOutlet="headerTpl() ?? null" />
        </div>
    }

    @if (contentTpl()) {
        <div #body rtElem="content" (scroll)="onBodyScroll()">
            <ng-container *ngTemplateOutlet="contentTpl() ?? null" />

            <!--
                Признак того, что снизу осталось непоказанное: край списка, ровно обрезанный
                подвалом, читается как конец списка, и человек считает, что пункт пропал. Полоса
                живёт внутри тела и липнет к его нижнему краю: узел рядом считал бы от хоста и
                уезжал под подвал, а обёртка вокруг тела меняла бы раскладку всем потребителям.
                Тень и значок берутся готовым кита.
            -->
            @if (isScrollHintShown() && hasMoreBelow()) {
                <div rtElem="scroll-hint" qa-dataid="scrollable-scroll-hint" [attr.aria-label]="scrollHintLabel">
                    <mat-icon rtElem="scroll-hint-icon" matTooltipPosition="above" [matTooltip]="scrollHintLabel">
                        keyboard_arrow_down
                    </mat-icon>
                </div>
            }
        </div>
    }

    @if (footerTpl()) {
        <div rtElem="footer">
            <ng-container *ngTemplateOutlet="footerTpl() ?? null" />
        </div>
    }
</ng-container>
