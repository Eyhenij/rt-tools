<ng-container rtBlock="rtui-side-menu-favorites">
    @if (favorites && rows().length) {
        <div rtElem="title" qa-dataid="side-menu-favorites-title">
            <mat-icon rtElem="title-icon" aria-hidden="true">star</mat-icon>
            <span rtElem="title-text">{{ favorites.labels.title }}</span>
        </div>

        <mat-nav-list
            rtElem="list"
            qa-dataid="side-menu-favorites"
            cdkDropList
            cdkDropListLockAxis="y"
            [cdkDropListData]="rows()"
            [attr.aria-label]="favorites.labels.title"
            (cdkDropListDropped)="onDrop($event)">
            @for (item of rows(); track item.id) {
                <div rtElem="row" qa-dataid="side-menu-favorite-row" cdkDrag [attr.data-id]="item.id" (cdkDragStarted)="onDragStart()">
                    <!--
                        Строку тянут только за ручку: остальная строка — ссылка, и строку, которую
                        тянут всем телом, не нажать без дрожи.
                    -->
                    <mat-icon rtElem="handle" qa-dataid="side-menu-favorite-handle" aria-hidden="true" cdkDragHandle>
                        drag_indicator
                    </mat-icon>

                    <rtui-side-menu-sub-item
                        rtElem="item"
                        [item]="item"
                        [inFavorites]="true"
                        [isSubMenuIconsOutlined]="isSubMenuIconsOutlined()"
                        [isSubMenuButtonIconsOutlined]="isSubMenuButtonIconsOutlined()"
                        [isSubMenuTooltipsShown]="isSubMenuTooltipsShown()"
                        (clickSubMenuAction)="clickSubMenuAction.emit($event)"
                        (clickSubMenuAdditionalAction)="clickSubMenuAdditionalAction.emit($event)" />
                </div>
            }
        </mat-nav-list>
    }
</ng-container>
