<ng-container rtBlock="login">
    <div rtElem="viewport">
        <rt-dot-field qa-dataid="kc-dot-field" />

        <!-- The switches stand outside the card: its glass holds a child with position: fixed inside
             itself, and on a wide screen they could not reach the corner of the window. On a narrow
             screen they lie over the first row of the card in the same grid cell. -->
        <div rtElem="chrome" qa-dataid="kc-chrome">
            @if (localeOptions.length > 0) {
                <rt-select
                    rtElem="locales"
                    qa-dataid="kc-locales"
                    size="sm"
                    [clearable]="false"
                    [ariaLabel]="languagesLabel"
                    [options]="localeOptions"
                    [formControl]="locale"
                    (selectionChange)="switchLocale($event)" />
            }

            <rt-theme-toggle qa-dataid="kc-theme" />
        </div>

        <section rtElem="card" qa-dataid="kc-card">
            @if (logo; as shown) {
                <img rtElem="logo" qa-dataid="kc-logo" [src]="shown.src" [alt]="shown.alt" />
            } @else {
                <span rtElem="brand" qa-dataid="kc-brand">{{ realmName }}</span>
            }

            <ng-container *ngComponentOutlet="page" />
        </section>
    </div>
</ng-container>
