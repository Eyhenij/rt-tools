<ng-container rtBlock="login">
    <h1 rtElem="title" qa-dataid="kc-title">{{ title }}</h1>

    <rt-kc-message />

    <form rtElem="form" method="post" qa-dataid="kc-register-form" [action]="context.url.registrationAction" (submit)="send($event)">
        <rt-field reserveHintSpace [label]="emailLabel" [attr.aria-label]="emailLabel" [errors]="emailErrors">
            <rt-input
                size="lg"
                type="email"
                autocomplete="email"
                iconLeft="user"
                qa-dataid="kc-email"
                [placeholder]="emailPlaceholder"
                [formControl]="form.controls.email" />
        </rt-field>

        <rt-field reserveHintSpace [label]="passwordLabel" [attr.aria-label]="passwordLabel" [errors]="passwordErrors">
            <rt-input
                size="lg"
                type="password"
                autocomplete="new-password"
                iconLeft="lock"
                qa-dataid="kc-password"
                [placeholder]="passwordPlaceholder"
                [passwordToggle]="true"
                [formControl]="form.controls.password" />
        </rt-field>

        <rt-field reserveHintSpace [label]="passwordConfirmLabel" [attr.aria-label]="passwordConfirmLabel" [errors]="passwordConfirmErrors">
            <rt-input
                size="lg"
                type="password"
                autocomplete="new-password"
                iconLeft="lock"
                qa-dataid="kc-password-confirm"
                [placeholder]="passwordConfirmPlaceholder"
                [passwordToggle]="true"
                [formControl]="form.controls.passwordConfirm" />
        </rt-field>

        @if (rules().length > 0) {
            <ul rtElem="rules" qa-dataid="kc-password-rules" [attr.aria-label]="ruleListLabel">
                @for (rule of rules(); track rule.key) {
                    <li rtElem="rule" qa-dataid="kc-password-rule" [rtMod]="{ met: rule.met }" [attr.data-met]="rule.met">
                        <rt-icon rtElem="rule-icon" name="check-circle" [size]="16" [fill]="rule.met" />
                        {{ rule.text }}
                    </li>
                }
            </ul>
        }

        <input type="hidden" name="email" [value]="value().email" />
        <input type="hidden" name="password" [value]="value().password" />
        <input type="hidden" name="password-confirm" [value]="value().passwordConfirm" />

        <!-- Подпись кнопке рисует директива кита: содержимое ей отдавать нельзя, оно будет затёрто -->
        <button
            rtButton
            size="lg"
            rtElem="submit"
            type="submit"
            qa-dataid="kc-register-submit"
            [label]="submitLabel"
            [attr.aria-label]="submitLabel"
            [loading]="sending()"></button>
    </form>

    @if (providers.length > 0) {
        <div rtElem="providers" qa-dataid="kc-providers">
            <span rtElem="providers-title">{{ providersLabel }}</span>
            @for (provider of providers; track provider.alias) {
                <a
                    rtButton
                    size="lg"
                    rtElem="provider"
                    appearance="outlined"
                    theme="secondary"
                    qa-dataid="kc-provider"
                    [attr.data-provider]="provider.alias"
                    [rtMod]="provider.mods"
                    [href]="provider.href"
                    [label]="provider.label"
                    [attr.aria-label]="provider.label"></a>
            }
        </div>
    }

    <nav rtElem="links">
        <a rtElem="link" qa-dataid="kc-back-to-login" [href]="context.url.loginUrl">{{ backLabel }}</a>
    </nav>
</ng-container>
