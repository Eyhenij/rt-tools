<admin-list-page [hint]="hint" [qaPrefix]="qaPrefix" [title]="title">
    <ng-template adminListToolbarLeft>
        <admin-tree-filter [choices]="choices()" [tree]="query().tree" (treeChange)="changeTree($event)" />
    </ng-template>

    <rt-table
        #rowsTable="rtTable"
        clickable
        [ariaLabel]="title"
        [attr.qa-dataid]="qaTable()"
        [columnsConfig]="columns()"
        [dataSource]="rows()"
        [emptyDescription]="emptyDescription()"
        [emptyMessage]="emptyMessage()"
        [loading]="loading()"
        [sort]="sortModel()"
        [tableId]="tableId"
        (sortChange)="changeSort($event)">
        <ng-container cdkColumnDef="tree">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="tree">{{ columns()[0].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-tree'">{{ row.tree.name }}</td>
        </ng-container>

        <ng-container cdkColumnDef="month">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="month">{{ columns()[1].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-month'">{{ row.month }}</td>
        </ng-container>

        <ng-container cdkColumnDef="sessions">
            <th *cdkHeaderCellDef cdk-header-cell>{{ columns()[2].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-sessions'">{{ row.sessions }}</td>
        </ng-container>

        <ng-container cdkColumnDef="ranAt">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="ranAt">{{ columns()[3].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-ran'">{{ row.ranAt | adminMoment }}</td>
        </ng-container>

        <tr *cdkHeaderRowDef="rowsTable.displayedColumns()" cdk-header-row></tr>
        <tr
            *cdkRowDef="let row; columns: rowsTable.displayedColumns()"
            cdk-row
            rtTableRow
            [attr.qa-dataid]="qaRow()"
            (activated)="openDetails(row.id)"></tr>
    </rt-table>
</admin-list-page>
