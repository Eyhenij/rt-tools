<ng-container rtBlock="admin-header">
    <span rtElem="brand" qa-dataid="admin-brand">{{ appTitle }}</span>

    <rt-page-header rtElem="nav" [ariaLabel]="navLabel" [items]="items()" [user]="user()" [userMenu]="profileMenu() ?? null" />
</ng-container>

<!--
    Попап профиля рисует кит, а его содержимое приходит отсюда шаблоном: ряд один на приложение, и
    вид попапа держится тем же компонентом, что и сам ряд.

    Стили этого блока живут в общем слое приложения: попап уезжает в наложение к концу страницы, и
    правила компонента, заскоупленные его атрибутом, до него не достают.
-->
<ng-template #profileMenuTpl>
    <div rtBlock="admin-profile-menu" qa-dataid="profile-menu">
        <span rtElem="name" qa-dataid="profile-name">{{ user()?.name }}</span>

        <!-- Тема и язык стоят строками «что меняем — чем меняем»: переключатель без подписи в
             попапе читается значком неизвестно чего -->
        <div rtElem="row">
            <span rtElem="row-label">{{ themeLabel }}</span>
            <rt-theme-toggle qa-dataid="profile-theme" />
        </div>

        <div rtElem="row">
            <span rtElem="row-label">{{ languageLabel }}</span>
            <admin-locale-switch qa-dataid="profile-language" />
        </div>

        <!-- Подпись кнопке рисует директива кита: содержимое ей отдавать нельзя, оно будет затёрто -->
        <button
            rtButton
            rtElem="action"
            type="button"
            appearance="text"
            qa-dataid="profile-sign-out"
            [label]="signOutLabel"
            [attr.aria-label]="signOutLabel"
            (click)="signOut.emit()"></button>
    </div>
</ng-template>
