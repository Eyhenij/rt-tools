<!--
    Зоны каркаса объявлены структурной формой директив — той, какой их показывает сам кит: она
    короче на строку и не даёт спутать зону с обычным шаблоном, который куда-то вставляют.

    Стопки тостов здесь нет намеренно: её рисует каркас, внизу по центру, и вторая показывала бы
    тот же тост второй раз в другом углу экрана — шину слушает каждая.
-->
<rt-container height="viewport">
    <ng-container *rtContainerHeader>
        <admin-header [items]="sections()" [user]="user()" (signOut)="signOut()" />
    </ng-container>

    <ng-container *rtContainerContent>
        <router-outlet />
    </ng-container>

    <ng-container *rtContainerRightSidenav>
        <router-outlet name="ro" />
    </ng-container>
</rt-container>
