<ng-container rtBlock="admin-page">
    <header rtElem="header">
        <h1 rtElem="title">{{ title() }}</h1>

        @if (hint(); as hintText) {
            <p rtElem="hint" [attr.qa-dataid]="hintId()">{{ hintText }}</p>
        }
    </header>

    <rt-toolbar>
        @if (leftTpl(); as left) {
            <ng-template rtToolbarLeft>
                <ng-container [ngTemplateOutlet]="left" />
            </ng-template>
        }

        <ng-template rtToolbarRight>
            @if (rightTpl(); as right) {
                <ng-container [ngTemplateOutlet]="right" />
            }

            <rt-icon-button
                icon="sliders-v"
                variant="ghost"
                [ariaLabel]="columnsLabel"
                [attr.qa-dataid]="columnsId()"
                [tooltip]="columnsLabel"
                (clicked)="host.openColumns()" />

            <rt-icon-button
                icon="sync"
                variant="primary"
                [ariaLabel]="refreshLabel"
                [attr.qa-dataid]="refreshId()"
                [loading]="host.loading()"
                [tooltip]="refreshLabel"
                (clicked)="host.retry()" />
        </ng-template>
    </rt-toolbar>

    @if (aboveTpl(); as above) {
        <div rtElem="above">
            <ng-container [ngTemplateOutlet]="above" />
        </div>
    }

    @if (host.fault() !== null) {
        <rt-message severity="danger" [attr.qa-dataid]="faultId()">
            <div rtElem="fault">
                <p>{{ faultText() }}</p>

                @if (incidentText(); as incident) {
                    <p>{{ incident }}</p>
                }

                <button rtButton type="button" appearance="text" [attr.qa-dataid]="retryId()" (click)="host.retry()">
                    {{ retryLabel }}
                </button>
            </div>
        </rt-message>
    } @else {
        <div rtElem="scroll">
            <ng-content />
        </div>
    }

    <rt-pagination
        [loading]="host.loading()"
        [pageModel]="host.pageModel()"
        [perPageOptions]="pageSizes"
        (pageChange)="host.goToPage($event)"
        (perPageChange)="host.changeSize($event)" />
</ng-container>
