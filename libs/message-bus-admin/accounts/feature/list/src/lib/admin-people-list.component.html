<admin-list-page [hint]="hint" [qaPrefix]="qaPrefix" [title]="title">
    <rt-table
        #rowsTable="rtTable"
        [ariaLabel]="title"
        [attr.qa-dataid]="qaTable()"
        [columnsConfig]="columns"
        [dataSource]="rows()"
        [emptyDescription]="emptyDescription()"
        [emptyMessage]="emptyMessage()"
        [loading]="loading()"
        [sort]="sortModel()"
        (sortChange)="changeSort($event)">
        <ng-container cdkColumnDef="name">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="name">{{ columns[0].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-name'">{{ row.name }}</td>
        </ng-container>

        <ng-container cdkColumnDef="role">
            <th *cdkHeaderCellDef cdk-header-cell>{{ columns[1].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-role'">{{ row.roleLabel }}</td>
        </ng-container>

        <!--
            Порядок по состоянию просится полем времени отключения: у приёмника состояние не
            колонка, а пустота этого времени, и заголовок, назвавший ключ столбца, получил бы отказ
            выборки на поле, которого в наборе нет.
        -->
        <ng-container cdkColumnDef="state">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="disabledAt">{{ columns[2].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-state'">{{ row.stateLabel }}</td>
        </ng-container>

        <ng-container cdkColumnDef="lastLoginAt">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="lastLoginAt">{{ columns[3].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-last-login'">
                @if (row.lastLoginAt) {
                    {{ row.lastLoginAt | adminMoment }}
                } @else {
                    {{ row.lastLoginLabel }}
                }
            </td>
        </ng-container>

        <tr *cdkHeaderRowDef="rowsTable.displayedColumns()" cdk-header-row></tr>
        <tr *cdkRowDef="let row; columns: rowsTable.displayedColumns()" cdk-row [attr.qa-dataid]="qaRow()"></tr>
    </rt-table>
</admin-list-page>
