<ng-container rtContainerRightSidenavPanel #panel="rtContainerRightPanel" (cancelled)="onCancel()" (closed)="onClosed()" />

<rt-aside qa-dataid="role-panel" [ariaLabel]="title()">
    <rt-aside-header qa-dataid="role-header" [title]="title()" (dismiss)="onClose()" />

    @if (submitError(); as fault) {
        <rt-message severity="danger" qa-dataid="role-fault">{{ fault }}</rt-message>
    }

    <ng-container rtBlock="admin-panel">
        <rt-field [hint]="nameHint()" [label]="nameLabel()" [loading]="resolving()">
            <rt-input qa-dataid="role-name" autocomplete="off" [formControl]="name" [placeholder]="nameLabel()" />
        </rt-field>

        <!-- Права по разделам: заголовок раздела — слово шапки, под ним чтение и правка. Поле
             берётся по имени права из записи полей, а не вызовом метода из шаблона -->
        <ng-container [formGroup]="rights">
            @for (group of groups(); track group.section) {
                <rt-aside-section [heading]="group.section">
                    <div rtElem="choices">
                        @for (option of group.rights; track option.right) {
                            <rt-checkbox [attr.qa-dataid]="'role-right-' + option.right" [formControlName]="option.right">
                                {{ option.action }}
                            </rt-checkbox>
                        }
                    </div>
                </rt-aside-section>
            }
        </ng-container>
    </ng-container>

    <rt-aside-footer>
        <button
            rtButton
            asidePrimary
            qa-dataid="role-submit"
            type="button"
            [attr.aria-label]="submitLabel()"
            [label]="submitLabel()"
            [loading]="submitting()"
            (click)="submit()"></button>

        <button
            rtButton
            asideDismiss
            qa-dataid="role-close"
            type="button"
            appearance="text"
            [attr.aria-label]="closeLabel()"
            [label]="closeLabel()"
            (click)="onClose()"></button>
    </rt-aside-footer>
</rt-aside>
