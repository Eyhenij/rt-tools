<admin-list-page [hint]="hint()" [qaPrefix]="qaPrefix" [title]="title()">
    @if (canManage()) {
        <ng-template adminListToolbarRight>
            <button
                rtButton
                icon="plus-circle"
                type="button"
                qa-dataid="roles-create"
                [attr.aria-label]="createLabel()"
                [label]="createLabel()"
                (click)="openCreate()"></button>
        </ng-template>
    }

    <!-- Блок общей страницы объявлен здесь заново ради ячейки прав: спроецированный узел блока
         страницы не получает, а ячейка с длинным значением обязана переноситься, а не тянуть
         таблицу за край экрана -->
    <ng-container rtBlock="admin-page">
        <rt-table
            #rowsTable="rtTable"
            [ariaLabel]="title()"
            [attr.qa-dataid]="qaTable()"
            [columnsConfig]="columns()"
            [dataSource]="rows()"
            [emptyDescription]="emptyDescription()"
            [emptyMessage]="emptyMessage()"
            [loading]="loading()"
            [showRowActions]="canManage()"
            [sort]="sortModel()"
            [tableId]="tableId"
            (sortChange)="changeSort($event)">
            <ng-container cdkColumnDef="name">
                <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="name">{{ columns()[0].label }}</th>
                <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-name'">{{ row.name }}</td>
            </ng-container>

            <ng-container cdkColumnDef="rights">
                <th *cdkHeaderCellDef cdk-header-cell>{{ columns()[1].label }}</th>
                <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-rights'">
                    <span rtElem="cell-wrap">{{ row.rightsLabel }}</span>
                </td>
            </ng-container>

            <ng-container cdkColumnDef="people">
                <th *cdkHeaderCellDef cdk-header-cell>{{ columns()[2].label }}</th>
                <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-people'">{{ row.people }}</td>
            </ng-container>

            <!-- Меню объявляется только с правом: без него раздел не открывается вовсе, а до ответа о
             вошедшем не прячется ничего. Удаление есть только у роли, которую никто не держит -->
            @if (canManage()) {
                <ng-template rtTableRowActions let-row [rtTableRowActionsRowType]="rows()">
                    <rt-menu-item
                        icon="pencil"
                        [label]="editLabel()"
                        [attr.qa-dataid]="qaPrefix + '-edit'"
                        (selected)="openEdit(row.key)" />

                    @if (row.canDelete) {
                        <rt-menu-item
                            danger
                            icon="trash"
                            [confirmLabel]="deleteLabel()"
                            [confirmMessage]="row.deleteQuestion"
                            [confirmTitle]="deleteTitle()"
                            [label]="deleteLabel()"
                            [attr.qa-dataid]="qaPrefix + '-delete'"
                            (selected)="remove(row)" />
                    }
                </ng-template>
            }

            <tr *cdkHeaderRowDef="rowsTable.displayedColumns()" cdk-header-row></tr>
            <tr *cdkRowDef="let row; columns: rowsTable.displayedColumns()" cdk-row [attr.qa-dataid]="qaRow()"></tr>
        </rt-table>
    </ng-container>
</admin-list-page>
