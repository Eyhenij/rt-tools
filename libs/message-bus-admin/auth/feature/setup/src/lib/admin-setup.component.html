<ng-container rtBlock="login">
    <!-- Та же полоса управления, что на входе: человек здесь тоже до попапа профиля -->
    <div rtElem="chrome" qa-dataid="setup-chrome">
        <admin-locale-switch qa-dataid="setup-language" />

        <rt-theme-toggle qa-dataid="setup-theme" />
    </div>

    <section rtElem="card">
        <span rtElem="brand" qa-dataid="setup-brand">{{ appTitle() }}</span>

        <h1 rtElem="title" qa-dataid="setup-title">{{ setupTitle() }}</h1>

        @if (ready()) {
            <p rtElem="hint" qa-dataid="setup-hint">{{ setupHint() }}</p>

            <form rtElem="form" [formGroup]="form" (ngSubmit)="submit()">
                @if (faultText(); as text) {
                    <rt-message severity="danger" qa-dataid="setup-fault">{{ text }}</rt-message>
                }

                <rt-field [label]="nameLabel()">
                    <rt-input formControlName="name" autocomplete="username" qa-dataid="setup-name" iconLeft="user" />
                </rt-field>

                <rt-field [label]="passwordLabel()">
                    <rt-input
                        formControlName="password"
                        type="password"
                        autocomplete="new-password"
                        qa-dataid="setup-password"
                        iconLeft="lock"
                        [passwordToggle]="true" />
                </rt-field>

                <!-- Подпись кнопке рисует директива кита: содержимое ей отдавать нельзя, оно будет затёрто -->
                <button
                    rtButton
                    rtElem="submit"
                    type="submit"
                    qa-dataid="setup-submit"
                    [label]="submitLabel()"
                    [attr.aria-label]="submitLabel()"
                    [loading]="pending()"></button>
            </form>
        }
    </section>
</ng-container>
