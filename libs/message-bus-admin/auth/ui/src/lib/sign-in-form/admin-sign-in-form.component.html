<ng-container rtBlock="login">
    <form rtElem="form" [formGroup]="form" (ngSubmit)="submit()">
        @if (faultText(); as text) {
            <rt-message severity="danger" qa-dataid="sign-in-fault">{{ text }}</rt-message>
        }

        <!-- Иконка и подсказка внутри поля: подпись сбоку на узкой ширине уходит первой, а
             спросить, что здесь пишут, человеку тогда не у кого -->
        <rt-field [label]="nameLabel()">
            <rt-input formControlName="name" autocomplete="username" qa-dataid="sign-in-name" iconLeft="user" [placeholder]="nameHint()" />
        </rt-field>

        <rt-field [label]="passwordLabel()">
            <rt-input
                formControlName="password"
                type="password"
                autocomplete="current-password"
                qa-dataid="sign-in-password"
                iconLeft="lock"
                [placeholder]="passwordHint()"
                [passwordToggle]="true" />
        </rt-field>

        <!-- Подпись кнопке рисует директива кита: содержимое ей отдавать нельзя, оно будет затёрто -->
        <button
            rtButton
            rtElem="submit"
            type="submit"
            qa-dataid="sign-in-submit"
            [label]="submitLabel()"
            [attr.aria-label]="submitLabel()"
            [loading]="pending()"></button>
    </form>
</ng-container>
