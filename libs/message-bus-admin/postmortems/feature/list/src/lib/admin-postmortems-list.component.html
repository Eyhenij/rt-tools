<admin-list-page
    [choices]="choices()"
    [fault]="fault()"
    [loading]="loading()"
    [pageModel]="pageModel()"
    [title]="title"
    [tree]="query().tree"
    (pageChange)="goToPage($event)"
    (retried)="retry()"
    (sizeChange)="changeSize($event)"
    (treeChange)="changeTree($event)">
    <table
        #rowsTable="rtTable"
        rt-table
        clickable
        qa-dataid="postmortems-table"
        [ariaLabel]="title"
        [columnsConfig]="columns"
        [dataSource]="rows()"
        [emptyMessage]="emptyMessage()"
        [loading]="loading()"
        [sort]="sortModel()"
        [tableId]="tableId"
        (sortChange)="changeSort($event)">
        <ng-container cdkColumnDef="tree">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="tree">{{ columns[0].label }}</th>
            <td *cdkCellDef="let row" cdk-cell qa-dataid="postmortems-cell-tree">{{ row.tree.name }}</td>
        </ng-container>

        <ng-container cdkColumnDef="file">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="file">{{ columns[1].label }}</th>
            <td *cdkCellDef="let row" cdk-cell qa-dataid="postmortems-cell-file">{{ row.file }}</td>
        </ng-container>

        <ng-container cdkColumnDef="arrivedAt">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="arrivedAt">{{ columns[2].label }}</th>
            <td *cdkCellDef="let row" cdk-cell qa-dataid="postmortems-cell-arrived">{{ row.arrivedAt | adminMoment }}</td>
        </ng-container>

        <ng-container cdkColumnDef="updatedAt">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="updatedAt">{{ columns[3].label }}</th>
            <td *cdkCellDef="let row" cdk-cell qa-dataid="postmortems-cell-updated">{{ row.updatedAt | adminMoment }}</td>
        </ng-container>

        <tr *cdkHeaderRowDef="rowsTable.displayedColumns()" cdk-header-row></tr>
        <tr
            *cdkRowDef="let row; columns: rowsTable.displayedColumns()"
            cdk-row
            qa-dataid="postmortems-row"
            rtTableRow
            (activated)="openDetails(row.id)"></tr>
    </table>
</admin-list-page>
