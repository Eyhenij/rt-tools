<admin-list-page [hint]="hint" [qaPrefix]="qaPrefix" [title]="title">
    <ng-template adminListToolbarLeft>
        <admin-tree-filter [choices]="choices()" [tree]="query().tree" (treeChange)="changeTree($event)" />
        <admin-state-filter [state]="query().state" (stateChange)="changeState($event)" />
    </ng-template>

    <rt-table
        #rowsTable="rtTable"
        clickable
        [ariaLabel]="title"
        [attr.qa-dataid]="qaTable()"
        [columnsConfig]="columns"
        [dataSource]="rows()"
        [emptyDescription]="emptyDescription()"
        [emptyMessage]="emptyMessage()"
        [loading]="loading()"
        [sort]="sortModel()"
        [tableId]="tableId"
        (sortChange)="changeSort($event)">
        <ng-container cdkColumnDef="tree">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="tree">{{ columns[0].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-tree'">{{ row.tree.name }}</td>
        </ng-container>

        <ng-container cdkColumnDef="file">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="file">{{ columns[1].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-file'">{{ row.file }}</td>
        </ng-container>

        <ng-container cdkColumnDef="state">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="state">{{ columns[2].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-state'">{{ row.stateLabel }}</td>
        </ng-container>

        <ng-container cdkColumnDef="arrivedAt">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="arrivedAt">{{ columns[3].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-arrived'">{{ row.arrivedAt | adminMoment }}</td>
        </ng-container>

        <ng-container cdkColumnDef="updatedAt">
            <th *cdkHeaderCellDef cdk-header-cell rtSortHeader="updatedAt">{{ columns[4].label }}</th>
            <td *cdkCellDef="let row" cdk-cell [attr.qa-dataid]="qaPrefix + '-cell-updated'">{{ row.updatedAt | adminMoment }}</td>
        </ng-container>

        <tr *cdkHeaderRowDef="rowsTable.displayedColumns()" cdk-header-row></tr>
        <tr
            *cdkRowDef="let row; columns: rowsTable.displayedColumns()"
            cdk-row
            rtTableRow
            [attr.qa-dataid]="qaRow()"
            (activated)="openDetails(row.id)"></tr>
    </rt-table>
</admin-list-page>
