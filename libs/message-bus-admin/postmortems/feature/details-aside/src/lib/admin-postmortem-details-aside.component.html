<ng-container rtContainerRightSidenavPanel #panel="rtContainerRightPanel" (cancelled)="onCancel()" (closed)="onClosed()" />

<rt-aside [ariaLabel]="title">
    <rt-aside-header [loading]="reading()" [overline]="overline()" [title]="title" (dismiss)="onClose()" />

    @if (record(); as entity) {
        <admin-postmortem-view [entity]="entity" />
    } @else if (missingText(); as reason) {
        <rt-empty-state qa-dataid="postmortem-details-missing" icon="ico-warning" [title]="reason" />
    }

    <rt-aside-footer>
        <button
            rtButton
            asideDismiss
            qa-dataid="postmortem-details-close"
            type="button"
            appearance="text"
            [attr.aria-label]="closeLabel"
            [label]="closeLabel"
            (click)="onClose()"></button>
    </rt-aside-footer>
</rt-aside>
