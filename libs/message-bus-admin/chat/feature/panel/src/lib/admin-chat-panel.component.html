<ng-container rtBlock="admin-chat">
    <section rtElem="talks" qa-dataid="chat-talks">
        <div rtElem="filters">
            <admin-chat-state-filter [state]="state()" (stateChange)="state.set($event)" />
        </div>

        @for (talk of rows(); track talk.id) {
            <admin-chat-talk [chosen]="talk.id === chosen()" [talk]="talk" (choose)="choose($event)" />
        } @empty {
            <rt-empty-state qa-dataid="chat-talks-empty" [description]="talksEmptyFrom()" [title]="talksEmpty()" />
        }
    </section>

    <section rtElem="feed" qa-dataid="chat-feed">
        @if (chosen()) {
            <div rtElem="messages">
                @for (message of messages(); track message.id) {
                    <admin-chat-message [message]="message" />
                } @empty {
                    <rt-empty-state qa-dataid="chat-feed-empty" [title]="feedEmpty()" />
                }
            </div>

            <div rtElem="send">
                <rt-field rtElem="field" [label]="sendPlaceholder()">
                    <rt-input qa-dataid="chat-answer" [formControl]="draft" [placeholder]="sendPlaceholder()" />
                </rt-field>

                <button
                    rtButton
                    qa-dataid="chat-answer-send"
                    type="button"
                    [attr.aria-label]="sendLabel()"
                    [label]="sendLabel()"
                    (click)="send()"></button>
            </div>
        } @else {
            <rt-empty-state qa-dataid="chat-feed-unchosen" [title]="feedUnchosen()" />
        }
    </section>
</ng-container>
