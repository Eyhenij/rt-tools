<rt-workspace [hasActive]="!!talk()" [storageKey]="workspaceStorageKey">
    <ng-template rtWorkspaceList>
        <!--
            Список переписок — готовый список кита: выбор строки, заглушки чтения и пустое
            состояние он умеет сам. Поле поиска кит рисует всегда, а поиска по тексту переписок у
            приёмника нет, и его место занято сужением по сайту.
        -->
        <rt-thread-list
            qa-dataid="chat-talks"
            [activeId]="chosen()"
            [emptyText]="talksEmpty()"
            [loading]="talksReading()"
            [rows]="talkRows()"
            (selectRow)="choose($event)">
            <ng-template rtThreadListSearch>
                <admin-chat-site-filter [site]="site()" [sites]="sites()" (siteChange)="site.set($event)" />
            </ng-template>

            <ng-template rtThreadListFilters>
                <admin-chat-state-filter [state]="state()" (stateChange)="state.set($event)" />
            </ng-template>

            <ng-template let-row [rtThreadListRow]="talkRows()">
                <admin-chat-talk [talk]="row" />
            </ng-template>
        </rt-thread-list>
    </ng-template>

    <ng-template rtWorkspaceCenter>
        <!--
            Лента и поле ответа — готовый чат кита: тред, состояния своей реплики и повтор
            отбитой он уже умеет. Про невыбранный разговор он говорит сам своей подписью, и
            второго пустого состояния рядом не ставится.

            `hasThread` стоит по выбранному разговору: без него кит прячет и ленту, и поле
            ответа — оператор не написал бы в пустой разговор первым.
        -->
        <rt-chat
            canReply
            fill
            showRefresh
            qa-dataid="chat-feed"
            [emptyHint]="feedUnchosen()"
            [hasThread]="!!talk()"
            [loading]="feedReading()"
            [messages]="thread()"
            [placeholder]="sendPlaceholder()"
            [title]="feedTitle()"
            (refresh)="refreshFeed()"
            (retryMessage)="again($event)"
            (send)="send($event)" />
    </ng-template>

    <ng-template rtWorkspaceAside>
        <!-- Свойства разговора и действия над ним: действие — не реплика, и в ленте ему не место -->
        <rt-workspace-details
            qa-dataid="chat-talk-details"
            [actions]="talkActions()"
            [loading]="talksReading()"
            [rows]="detailRows()"
            [title]="talk() ? detailsTitle() : null"
            (actionClicked)="changeState($event)" />
    </ng-template>
</rt-workspace>
