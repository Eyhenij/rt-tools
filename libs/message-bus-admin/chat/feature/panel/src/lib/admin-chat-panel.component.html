<ng-container rtBlock="admin-chat">
    <section rtElem="talks" qa-dataid="chat-talks">
        <div rtElem="filters">
            <admin-chat-site-filter [site]="site()" [sites]="sites()" (siteChange)="site.set($event)" />
            <admin-chat-state-filter [state]="state()" (stateChange)="state.set($event)" />
        </div>

        @for (talk of rows(); track talk.id) {
            <admin-chat-talk [chosen]="talk.id === chosen()" [talk]="talk" (choose)="choose($event)" />
        } @empty {
            <rt-empty-state qa-dataid="chat-talks-empty" [description]="talksEmptyFrom()" [title]="talksEmpty()" />
        }
    </section>

    <section rtElem="feed" qa-dataid="chat-feed">
        @if (chosen()) {
            <button
                rtButton
                rtElem="state"
                qa-dataid="chat-talk-state"
                type="button"
                appearance="text"
                [attr.aria-label]="stateLabel()"
                [label]="stateLabel()"
                (click)="changeState()"></button>

            <!--
                Лента и поле ответа — готовый чат кита: тред, состояния своей реплики и повтор
                отбитой он уже умеет. Про пустой разговор он говорит сам — своей подписью.

                `hasThread` стоит всегда: разговор здесь уже выбран, а без этого входа кит прячет
                и ленту, и поле ответа — оператор не написал бы в пустой разговор первым.
            -->
            <rt-chat
                canReply
                fill
                hasThread
                rtElem="thread"
                [loading]="feedReading()"
                [messages]="thread()"
                [placeholder]="sendPlaceholder()"
                (retryMessage)="again($event)"
                (send)="send($event)" />
        } @else {
            <rt-empty-state qa-dataid="chat-feed-unchosen" [title]="feedUnchosen()" />
        }
    </section>
</ng-container>
