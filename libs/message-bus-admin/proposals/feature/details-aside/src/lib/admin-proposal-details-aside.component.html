<ng-container rtContainerRightSidenavPanel #panel="rtContainerRightPanel" (cancelled)="onCancel()" (closed)="onClosed()" />

<rt-aside qa-dataid="proposal-details-panel" [ariaLabel]="title()">
    <rt-aside-header
        qa-dataid="proposal-details-header"
        [loading]="reading()"
        [overline]="overline()"
        [title]="title()"
        (dismiss)="onClose()" />

    @if (record() !== null || reading()) {
        <admin-proposal-view [entity]="record()" [reading]="reading()" />
    } @else if (missingText(); as reason) {
        <rt-empty-state qa-dataid="proposal-details-missing" icon="ico-warning" [title]="reason" />
    }

    <rt-aside-footer>
        <button
            rtButton
            asideDismiss
            qa-dataid="proposal-details-close"
            type="button"
            appearance="text"
            [attr.aria-label]="closeLabel()"
            [label]="closeLabel()"
            (click)="onClose()"></button>
    </rt-aside-footer>
</rt-aside>
